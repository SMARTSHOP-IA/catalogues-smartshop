<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogues Smartshop</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>
<style>
  :root{
    --ink:#1D1D1F;
    --ink-soft:#6E6E73;
    --paper:#FFFFFF;
    --paper-line:#DEDEE3;
    --card:#FFFFFF;
    --cyan:#0071E3;
    --cyan-soft:#F6FAFF;
    --magenta:#0071E3;
    --magenta-soft:#F6FAFF;
    --yellow:#FF9500;
    --yellow-soft:#FFF4E5;
    --good:#1F8A57;
    --good-soft:#EAF7EF;
    --bad:#D9362D;
    --bad-soft:#FDECEB;
    --shell-bg:#F5F5F7;
    --sidebar-bg:#FAFAFB;
    --modal-bg:#FFFFFF;
    --input-bg:#FCFBF8;
    --solid-bg:#1D1D1F;
    --solid-fg:#FFFFFF;
    --mono: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --disp: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  [data-theme="dark"]{
    --ink:#F2F2F3;
    --ink-soft:#9A9AA1;
    --paper:#1C1C1E;
    --paper-line:#3A3A3C;
    --card:#242426;
    --cyan:#3B9CFF;
    --cyan-soft:#132A3D;
    --magenta:#3B9CFF;
    --magenta-soft:#132A3D;
    --yellow:#FFB143;
    --yellow-soft:#3A2E12;
    --good:#3ECE84;
    --good-soft:#12301F;
    --bad:#FF6B5E;
    --bad-soft:#3A1613;
    --shell-bg:#141415;
    --sidebar-bg:#1A1A1C;
    --modal-bg:#242426;
    --input-bg:#1C1C1E;
    --solid-bg:#F2F2F3;
    --solid-fg:#1C1C1E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

  .app-shell{display:flex;min-height:100vh;background:var(--shell-bg);}
  .sidebar{width:250px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--paper-line);display:flex;flex-direction:column;padding:20px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;transition:width .2s ease,background .2s ease;position:relative;}
  .sidebar.collapsed{width:64px;padding:20px 8px;overflow:visible;}
  .sidebar.collapsed .brand-sub,
  .sidebar.collapsed .sidebar-nav-item span,
  .sidebar.collapsed .sidebar-section-label,
  .sidebar.collapsed .sidebar-clients,
  .sidebar.collapsed .sync-indicator,
  .sidebar.collapsed .sidebar-footer-item span,
  .sidebar.collapsed .sidebar-add-client span{display:none;}
  .sidebar.collapsed .brand-title{font-size:0;}
  .sidebar.collapsed .brand-title::after{content:"S";font-size:17px;}
  .sidebar.collapsed .sidebar-nav-item{justify-content:center;}
  .sidebar.collapsed .sidebar-footer-item{justify-content:center;}
  .sidebar-collapse-btn{position:absolute;top:18px;right:-12px;width:24px;height:24px;border-radius:50%;background:var(--card);border:1px solid var(--paper-line);color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;}
  .sidebar-collapse-btn:hover{color:var(--cyan);border-color:var(--cyan);}
  .sidebar-collapse-btn svg{width:12px;height:12px;transition:transform .2s;}
  .sidebar.collapsed .sidebar-collapse-btn svg{transform:rotate(180deg);}
  .sidebar-brand{padding:2px 10px 22px;}
  .brand-title{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--ink);}
  .brand-sub{font-family:var(--sans);font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .sidebar-nav{display:flex;flex-direction:column;gap:2px;margin-bottom:20px;}
  .sidebar-nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;background:none;border:none;text-align:left;width:100%;}
  .sidebar-nav-item:hover{background:var(--paper-line);}
  .sidebar-nav-item.active{background:var(--cyan);color:#fff;}
  .sidebar-nav-item svg{width:17px;height:17px;flex-shrink:0;}
  .sidebar-section-label{font-family:var(--mono);font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-soft);padding:4px 10px;margin-bottom:2px;}
  .sidebar-clients{display:flex;flex-direction:column;gap:2px;}
  .sidebar-client-row{display:flex;align-items:center;border-radius:8px;}
  .sidebar-client-row:hover{background:var(--paper-line);}
  .sidebar-client-row.active{background:var(--cyan);}
  .sidebar-client-btn{flex:1;text-align:left;padding:8px 4px 8px 10px;border-radius:8px;font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink);background:none;border:none;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .sidebar-client-count{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--ink-soft);background:var(--paper-line);padding:1px 7px;border-radius:10px;flex-shrink:0;}
  .sidebar-client-row.active .sidebar-client-count{background:rgba(255,255,255,.25);color:#fff;}
  .sidebar-client-row.active .sidebar-client-btn{color:#fff;}
  .sidebar-client-edit{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:6px 8px;flex-shrink:0;}
  .sidebar-client-row.active .sidebar-client-edit{color:#fff;}
  .sidebar-client-edit svg{width:13px;height:13px;display:block;}
  .sidebar-add-client{margin-top:6px;border:1px dashed var(--paper-line);border-radius:8px;padding:8px 10px;font-family:var(--sans);font-size:13px;color:var(--ink-soft);background:none;cursor:pointer;text-align:left;width:100%;display:flex;align-items:center;gap:8px;}
  .sidebar-archived-link{margin-top:6px;background:none;border:none;color:var(--ink-soft);font-family:var(--sans);font-size:12px;cursor:pointer;text-align:left;padding:6px 8px;width:100%;}
  .sidebar-archived-link:hover{color:var(--cyan);}
  .sidebar-add-client:hover{border-color:var(--cyan);color:var(--cyan);}
  .sidebar-add-client svg{width:14px;height:14px;}
  .sidebar-rename-input{width:100%;font-family:var(--sans);font-size:13px;padding:7px 8px;border:1px solid var(--cyan);border-radius:6px;margin-bottom:4px;}
  .sidebar-rename-actions{display:flex;gap:6px;margin-bottom:4px;padding:0 2px;}
  .sidebar-rename-actions button{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:6px;border:1px solid var(--paper-line);background:var(--card);color:var(--ink);cursor:pointer;}
  .sidebar-spacer{flex:1;}
  .sidebar-footer{display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--paper-line);padding-top:10px;}
  .sidebar-footer-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-family:var(--sans);font-size:13px;color:var(--ink);background:none;border:none;cursor:pointer;text-align:left;width:100%;}
  .sidebar-footer-item:hover{background:var(--paper-line);}
  .sidebar-footer-item svg{width:15px;height:15px;flex-shrink:0;color:var(--ink-soft);}
  .sync-indicator{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);padding:8px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .sync-dot-ok{background:var(--good);}
  .sync-dot-warn{background:var(--yellow);}
  .sync-dot-syncing{background:var(--cyan);animation:pulse-dot 1s infinite;}
  @keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.3;}}
  .sync-indicator.warn{color:#8a6d00;}
  .sync-indicator button{background:none;border:none;color:var(--cyan);font-family:var(--sans);font-size:11.5px;font-weight:600;cursor:pointer;padding:0;text-decoration:underline;}
  .field-invalid{border-color:var(--bad) !important;background:var(--bad-soft) !important;}
  .block-highlight{animation:highlight-pulse 2s ease-out;}
  @keyframes highlight-pulse{
    0%{box-shadow:0 0 0 3px var(--cyan);}
    70%{box-shadow:0 0 0 3px var(--cyan);}
    100%{box-shadow:0 0 0 0 transparent;}
  }
  .bulk-toolbar{display:flex;align-items:center;gap:12px;background:var(--cyan-soft);border:1px solid var(--cyan);border-radius:8px;padding:10px 14px;margin-bottom:10px;font-family:var(--sans);font-size:13px;color:#0d5f87;}
  .bulk-checkbox{margin-right:2px;accent-color:var(--cyan);cursor:pointer;}
  .main-content{flex:1;min-width:0;padding:28px 32px 80px;}

  /* header */
  .masthead{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;margin-bottom:0;flex-wrap:wrap;gap:16px;}
  .masthead h1{font-family:var(--disp);font-size:28px;letter-spacing:.2px;margin:0;font-weight:700;}
  .masthead .kicker{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--magenta);margin:0 0 2px;}
  .masthead .meta{font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
  .masthead .logo img{height:44px;display:block;}
  .cmyk-rule{height:1px;background:var(--paper-line);margin-bottom:6px;}

  /* client tabs */
  .tabbar{display:flex;align-items:center;gap:6px;margin:18px 0 22px;flex-wrap:wrap;}
  .tab{font-family:var(--sans);font-weight:500;font-size:13px;padding:8px 16px;border:1px solid var(--paper-line);background:transparent;color:var(--ink);cursor:pointer;border-radius:8px;}
  .tab:hover{border-color:var(--magenta);color:var(--magenta);background:var(--magenta-soft);}
  .tab.active{background:var(--cyan);color:#fff;border-color:var(--cyan);}
  .tab.active:hover{background:var(--magenta);border-color:var(--magenta);color:#fff;}
  .tab-add{font-family:var(--mono);font-size:13px;padding:8px 14px;border:1.5px dashed var(--ink-soft);background:transparent;color:var(--ink-soft);cursor:pointer;border-radius:8px;}
  .tab-add:hover{border-color:var(--cyan);color:var(--cyan);}
  .tab-rename{font-size:11px;background:transparent;border:1.5px solid transparent;color:var(--ink-soft);cursor:pointer;padding:6px 6px;border-radius:8px;}
  .tab-rename:hover{color:var(--magenta);border-color:var(--magenta);}
  .tab-group{display:inline-flex;align-items:center;gap:1px;}

  /* dashboard summary */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--paper-line);border:1px solid var(--paper-line);border-radius:12px;overflow:hidden;margin-bottom:22px;}
  .stat{background:var(--card);padding:14px 16px;}
  .catmode-toggle{display:flex;gap:8px;margin:14px 0;}
  .catmode-btn{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:9px;border:1.5px solid var(--paper-line);background:var(--card);color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;gap:8px;}
  .catmode-btn:hover{border-color:var(--cyan);}
  .catmode-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .catmode-count{background:var(--paper);color:var(--ink-soft);border-radius:20px;padding:1px 8px;font-size:11.5px;font-weight:700;}
  .catmode-btn.active .catmode-count{background:rgba(255,255,255,.2);color:#fff;}
  .stat .num{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1;}
  .stat .lbl{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);margin-top:6px;}

  .actionbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .actionbar h2{font-family:var(--disp);font-size:19px;margin:0;}
  button.primary{font-family:var(--sans);font-weight:600;font-size:13px;background:var(--cyan);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;}
  button.primary:hover{background:var(--magenta);}
  button.primary:disabled, button.ghost:disabled{opacity:0.4;cursor:not-allowed;}
  button.primary:disabled:hover{background:var(--solid-bg);}
  button.ghost{font-family:var(--mono);font-size:11px;background:transparent;border:1px solid var(--ink-soft);color:var(--ink-soft);padding:6px 10px;border-radius:8px;cursor:pointer;}
  button.ghost:hover{border-color:var(--bad);color:var(--bad);}
  button.link{background:none;border:none;color:var(--magenta);font-family:var(--sans);font-weight:500;font-size:11.5px;cursor:pointer;padding:4px 0;text-decoration:none;}
  button.link:hover{text-decoration:underline;}

  /* form */
  .formcard{background:var(--card);border:1px solid var(--paper-line);border-left:4px solid var(--magenta);padding:18px;margin-bottom:24px;border-radius:8px;}
  .formcard h3{font-family:var(--disp);font-size:16px;margin:0 0 12px;}
  .formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px;}
  .form-section-label{font-family:var(--mono);font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--cyan);margin:16px 0 8px;border-top:1px solid var(--paper-line);padding-top:14px;}
  .formcard .form-section-label:first-of-type{border-top:none;padding-top:0;margin-top:4px;}
  .form-hint{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);margin:0 0 8px;}
  .price-editor-table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:13px;}
  .price-editor-table th{text-align:center;font-family:var(--sans);font-weight:600;font-size:11px;color:var(--ink-soft);padding:4px 6px;border-bottom:1px solid var(--paper-line);}
  .price-editor-table td{padding:4px 6px;}
  .price-editor-table input{width:100%;padding:6px 8px;border:1px solid var(--paper-line);border-radius:6px;font-family:var(--sans);font-size:13px;background:var(--input-bg);color:var(--ink);}
  .price-editor-table .pt-remove{background:none;border:1px solid var(--paper-line);border-radius:6px;color:var(--bad);cursor:pointer;padding:4px 8px;}
  .price-editor-table .pt-remove:disabled{opacity:.3;cursor:not-allowed;}
  .price-editor-table .pt-ref{accent-color:var(--cyan);cursor:pointer;}
  .matrix-scroll{overflow-x:auto;border:1px solid var(--paper-line);border-radius:10px;}
  table.supplier-matrix{border-collapse:collapse;font-family:var(--sans);font-size:12.5px;white-space:nowrap;}
  table.supplier-matrix th, table.supplier-matrix td{border-bottom:1px solid var(--paper-line);border-right:1px solid var(--paper-line);padding:6px 10px;text-align:center;}
  table.supplier-matrix th{background:var(--card);font-weight:600;color:var(--ink-soft);font-size:11px;}
  table.supplier-matrix .qty-head, table.supplier-matrix .qty-cell{text-align:center;background:var(--card);font-weight:700;color:var(--ink);position:sticky;left:0;z-index:2;box-shadow:2px 0 4px rgba(0,0,0,0.06);}
  table.supplier-matrix .pv-head, table.supplier-matrix .pv-cell{text-align:center;background:var(--cyan-soft);font-weight:700;color:var(--ink);position:sticky;left:87px;z-index:2;box-shadow:2px 0 4px rgba(0,0,0,0.06);}
  table.supplier-matrix .pv-cell .matrix-input{font-weight:700;color:#0d5f87;width:52px;}
  table.supplier-matrix .supplier-head{text-align:center;font-size:13px;color:var(--ink);border-bottom:1px solid var(--paper-line);}
  table.supplier-matrix .subheader-row th{background:var(--shell-bg);}
  table.supplier-matrix .supplier-head-row{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;}
  table.supplier-matrix .supplier-name-inline{font-weight:700;}
  table.supplier-matrix .supplier-head-right{display:flex;align-items:center;gap:4px;margin-left:auto;}
  table.supplier-matrix .supplier-date-inline{font-size:10px;font-weight:400;color:var(--ink-soft);white-space:nowrap;}
  table.supplier-matrix .supplier-ref-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  table.supplier-matrix .supplier-ref-left{font-size:11px;font-weight:400;color:var(--ink-soft);display:flex;align-items:center;gap:4px;}
  table.supplier-matrix .supplier-ref-left a:not(.link-icon){color:var(--cyan);text-decoration:underline;}
  table.supplier-matrix .icon-btn{background:none;border:1px solid var(--paper-line);border-radius:6px;color:var(--ink-soft);cursor:pointer;font-size:10px;padding:2px 5px;flex-shrink:0;}
  table.supplier-matrix .icon-btn:hover{color:var(--cyan);border-color:var(--cyan);}
  table.supplier-matrix .supplier-ref-head{text-align:center;font-size:11px;font-weight:400;}
  table.supplier-matrix .supplier-finitions{display:block;color:var(--ink-soft);font-size:10.5px;text-align:right;white-space:nowrap;}
  table.supplier-matrix .retenu-label{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:3px;font-size:10.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  table.supplier-matrix .retenu-label input{accent-color:var(--good);cursor:pointer;}
  table.supplier-matrix .retenu-col{background:var(--good-soft);}
  table.supplier-matrix th.retenu-col{background:var(--good-soft);}
  table.supplier-matrix .empty-cell{text-align:center;color:var(--ink-soft);}
  table.supplier-matrix .matrix-input{width:46px;border:1px solid transparent;background:transparent;text-align:center;font-family:var(--sans);font-size:12px;color:var(--ink);padding:3px 4px;border-radius:5px;-moz-appearance:textfield;}
  table.supplier-matrix .matrix-input::-webkit-outer-spin-button,
  table.supplier-matrix .matrix-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  table.supplier-matrix .matrix-input:hover{border-color:var(--paper-line);background:var(--input-bg);}
  table.supplier-matrix .matrix-input:focus{border-color:var(--cyan);background:var(--input-bg);outline:none;}
  table.supplier-matrix .qty-cell{display:flex;align-items:center;justify-content:center;gap:2px;}
  table.supplier-matrix .qty-input{width:42px;font-weight:700;text-align:center;padding:3px 2px;}
  table.supplier-matrix .qty-remove{margin-left:4px;padding:0 4px;font-size:9px;opacity:0;transition:opacity .15s;}
  table.supplier-matrix .qty-cell:hover .qty-remove{opacity:1;}
  table.supplier-matrix .add-qty-row td{border-bottom:none;background:var(--card);}
  table.supplier-matrix .add-qty-row .link{font-size:11.5px;}
  table.supplier-matrix .link-icon{width:20px;height:20px;font-size:10.5px;flex-shrink:0;}
  .formgrid label{font-family:var(--mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .formgrid input,.formgrid select{width:100%;padding:8px 9px;border:1px solid #C9C2AE;border-radius:8px;font-family:var(--sans);font-size:13px;background:var(--input-bg);}
  .formgrid input:focus,.formgrid select:focus{outline:2px solid var(--cyan);outline-offset:0;border-color:var(--cyan);}
  .formactions{margin-top:14px;display:flex;gap:8px;}

  /* product cards */
  .block{background:var(--card);border:1px solid var(--paper-line);margin-bottom:16px;border-radius:8px;overflow:hidden;}
  .block-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--paper);border-bottom:1px solid var(--paper-line);flex-wrap:wrap;gap:8px;}
  .block-head .tag{font-family:var(--sans);font-weight:700;font-size:10.5px;letter-spacing:.3px;text-transform:uppercase;padding:3px 8px;border-radius:8px;margin-right:8px;}
  .block-head .pname{font-weight:700;font-size:15px;}
  .block-head .ptechnique{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);}
  .designer-check{display:inline-flex;align-items:center;gap:5px;font-family:var(--sans);font-size:12px;color:var(--ink-soft);cursor:pointer;background:var(--yellow-soft);padding:3px 9px;border-radius:8px;}
  .designer-check input{accent-color:var(--yellow);cursor:pointer;}
  .designer-check:has(input:checked){color:#8a6d00;font-weight:600;}
  .block-head .sub{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);}
  .block-body{padding:14px 16px 16px;}
  .block.block-warning{border-left:4px solid var(--bad);}
  .block.block-archived{background:var(--bad-soft);border-left:4px solid var(--bad);opacity:.85;}
  .block.block-archived .pname{text-decoration:line-through;color:var(--ink-soft);}
  .tag-chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;background:var(--cyan-soft);color:#0d5f87;padding:2px 6px;border-radius:10px;}
  .tag-chip button{background:none;border:none;color:#0d5f87;cursor:pointer;font-size:11px;padding:0;line-height:1;}
  .tags-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--paper-line);}
  .tag-input{font-family:var(--sans);font-size:12px;padding:3px 6px;border:1px solid var(--paper-line);border-radius:8px;width:120px;}
  .history-details{margin-top:12px;font-family:var(--mono);font-size:11.5px;}
  .history-details summary{cursor:pointer;color:var(--ink-soft);}
  .history-details summary:hover{color:var(--magenta);}

<script>
(function(){
  const CATS = ["Goodies","Textile","PLV","Print"];
  let clients = [];
  let currentClient = null;
  let data = {}; // { clientName: [blocks] }
  let showForm = false;

  const uid = () => Math.random().toString(36).slice(2,9);

  function showBanner(msg, type){
    const el = document.getElementById('banner');
    el.innerHTML = `<div class="banner ${type||'error'}"><span>${msg}</span><button id="bannerClose">✕</button></div>`;
    document.getElementById('bannerClose').onclick = ()=>{ el.innerHTML=''; };
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(()=>{ el.innerHTML=''; }, 6000);
  }
  function parseNum(str){
    if(str === null || str === undefined) return NaN;
    const cleaned = String(str).trim().replace(',', '.');
    if(cleaned === '') return NaN;
    return parseFloat(cleaned);
  }

  // ---- Firebase : authentification Google + base de données partagée Firestore ----
  const firebaseConfig = {
    apiKey: "AIzaSyDSb3lmftpgG-fRvlkl7YHhTiwA_veN1Ck",
    authDomain: "smartshop-catalogues.firebaseapp.com",
    projectId: "smartshop-catalogues",
    storageBucket: "smartshop-catalogues.firebasestorage.app",
    messagingSenderId: "161620663653",
    appId: "1:161620663653:web:8a89f06f89597b57d9d58c",
    measurementId: "G-J1WZXTBC21"
  };
  firebase.initializeApp(firebaseConfig);
  const fbAuth = firebase.auth();
  const fbDb = firebase.firestore();
  let currentUserEmail = null;
  let currentUserRole = null; // 'editor' | 'viewer' | null (non autorisé)

  function setAuthStatus(msg, isError){
    const el = document.getElementById('authStatus');
    if(el){ el.textContent = msg; el.style.color = isError ? '#D9362D' : ''; }
  }

  function requireEditor(){
    if(currentUserRole !== 'editor'){
      showBanner("Vous êtes en lecture seule sur ce catalogue partagé — contactez une personne avec les droits de modification.", 'error');
      return false;
    }
    return true;
  }

  document.getElementById('googleSignInBtn').onclick = async ()=>{
    setAuthStatus('Connexion en cours...');
    try{
      const provider = new firebase.auth.GoogleAuthProvider();
      await fbAuth.signInWithPopup(provider);
    }catch(e){
      console.error(e);
      setAuthStatus("La connexion a échoué : " + (e && e.message ? e.message : 'erreur inconnue'), true);
    }
  };

  fbAuth.onAuthStateChanged(async (user)=>{
    const gate = document.getElementById('authGate');
    const shell = document.getElementById('appShell');
    if(!user){
      currentUserEmail = null; currentUserRole = null;
      gate.style.display = 'flex';
      shell.style.display = 'none';
      return;
    }
    currentUserEmail = user.email;
    setAuthStatus('Vérification des accès...');
    try{
      const doc = await fbDb.collection('authorizedUsers').doc(user.email).get();
      if(!doc.exists){
        setAuthStatus(`Accès non autorisé pour ${user.email}. Contactez celia@smart-clic.fr pour être ajouté(e).`, true);
        await fbAuth.signOut();
        return;
      }
      currentUserRole = doc.data().role === 'editor' ? 'editor' : 'viewer';
      gate.style.display = 'none';
      shell.style.display = '';
      document.body.classList.toggle('role-viewer-mode', currentUserRole === 'viewer');
      await loadAll();
      renderAll();
    }catch(e){
      console.error(e);
      setAuthStatus("Erreur de vérification des accès : " + (e && e.message ? e.message : 'erreur inconnue') + " — vérifiez les règles Firestore.", true);
    }
  });

  // ---- Sauvegarde locale de secours : chaque écriture vers Claude est aussi dupliquée
  // dans la mémoire de ce navigateur (localStorage), pour que rien ne se perde si le
  // service de stockage de Claude a un incident. À la lecture, on retombe automatiquement
  // sur cette copie locale si Claude ne répond pas ou renvoie une erreur.
  const LOCAL_BACKUP_PREFIX = 'smartshop_backup_';
  let lastSyncOk = true; // reflète si la dernière écriture a bien atteint Claude
  let pendingSyncKeys = new Set(); // clés écrites en local mais pas encore confirmées sur Claude
  let syncing = false;

  function localBackupSet(key, value){
    try{ localStorage.setItem(LOCAL_BACKUP_PREFIX + key, value); }catch(e){ /* navigateur sans localStorage : tant pis, on continue */ }
  }
  function localBackupGet(key){
    try{
      const v = localStorage.getItem(LOCAL_BACKUP_PREFIX + key);
      return v !== null ? v : undefined;
    }catch(e){ return undefined; }
  }

  // Remplace window.storage.set : écrit toujours en local d'abord, puis tente Claude.
  // Ne lève une exception que si l'écriture locale elle-même échoue.
  async function dualSet(key, value){
    localBackupSet(key, value);
    try{
      await fbDb.collection('catalogueData').doc(key).set({
        value,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy: currentUserEmail || null
      });
      lastSyncOk = true;
      pendingSyncKeys.delete(key);
      updateSyncIndicator();
      return {key, value};
    }catch(e){
      lastSyncOk = false;
      pendingSyncKeys.add(key);
      updateSyncIndicator();
      console.error('Firestore set failed, donnée conservée localement uniquement :', e);
      return null;
    }
  }

  async function resyncPending(){
    if(syncing) return;
    if(pendingSyncKeys.size === 0){ showBanner('Rien à resynchroniser, tout est déjà à jour.', 'info'); return; }
    syncing = true;
    updateSyncIndicator();
    const keys = Array.from(pendingSyncKeys);
    let ok = 0, fail = 0;
    for(const key of keys){
      const value = localBackupGet(key);
      if(value === undefined){ pendingSyncKeys.delete(key); continue; }
      try{
        await fbDb.collection('catalogueData').doc(key).set({
          value, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: currentUserEmail || null
        });
        pendingSyncKeys.delete(key); ok++;
      }catch(e){ fail++; }
    }
    syncing = false;
    lastSyncOk = pendingSyncKeys.size === 0;
    updateSyncIndicator();
    if(fail === 0) showBanner(`Resynchronisation réussie (${ok} élément(s)) ✓`, 'info');
    else showBanner(`Resynchronisation partielle : ${ok} réussie(s), ${fail} encore en attente (Claude semble toujours indisponible).`, 'error');
  }

  let lastGetFailed = false; // reflète si la dernière LECTURE Claude a échoué (secours local utilisé)

  function updateSyncIndicator(){
    const el = document.getElementById('syncIndicator');
    if(!el) return;
    if(syncing){
      el.innerHTML = `<span class="sync-dot sync-dot-syncing"></span> Resynchronisation en cours...`;
      el.className = 'sync-indicator syncing';
    } else if(pendingSyncKeys.size > 0){
      el.innerHTML = `<span class="sync-dot sync-dot-warn"></span> Non synchronisé (${pendingSyncKeys.size}) · <button id="resyncBtn">Resynchroniser</button>`;
      el.className = 'sync-indicator warn';
    } else if(lastGetFailed){
      el.innerHTML = `<span class="sync-dot sync-dot-warn"></span> Claude indisponible en lecture (secours local actif) · <button id="resyncBtn">Réessayer</button>`;
      el.className = 'sync-indicator warn';
    } else {
      el.innerHTML = `<span class="sync-dot sync-dot-ok"></span> Synchronisé avec Claude`;
      el.className = 'sync-indicator ok';
    }
    const btn = document.getElementById('resyncBtn');
    if(btn) btn.onclick = pendingSyncKeys.size > 0 ? resyncPending : retryReadFromClaude;
  }

  // Retente une lecture Claude (utile quand seule la lecture échouait, pas l'écriture) :
  // recharge tout depuis Claude si possible, et actualise l'indicateur en conséquence.
  async function retryReadFromClaude(){
    if(syncing) return;
    syncing = true;
    updateSyncIndicator();
    await loadAll();
    syncing = false;
    updateSyncIndicator();
    if(!lastGetFailed) showBanner('Connexion à Claude rétablie en lecture ✓', 'info');
    else showBanner("Claude semble toujours indisponible en lecture — vos données restent visibles via le secours local.", 'error');
    renderAll();
  }

  // Remplace window.storage.get : si Claude échoue ou n'a rien, retombe sur la copie locale.
  async function dualGet(key){
    try{
      const doc = await fbDb.collection('catalogueData').doc(key).get();
      lastGetFailed = false;
      if(doc.exists) return {key, value: doc.data().value};
    }catch(e){
      lastGetFailed = true;
      console.error('Firestore get failed, tentative de secours locale :', e);
    }
    const local = localBackupGet(key);
    return local !== undefined ? {key, value: local} : null;
  }

  function migrateBlockPricing(b){
    if(!b.catalogue.prix || !b.catalogue.prix.length){
      b.catalogue.prix = [{id: uid(), quantite: b.quantite, pa: b.catalogue.pa, frais: b.catalogue.frais || 0}];
    }
    // chaque ligne de prix du catalogue a son propre historique de PA ; on récupère l'ancien
    // historique (qui ne suivait que la quantité de référence) pour ne rien perdre
    b.catalogue.prix.forEach(row=>{
      if(!row.historique){
        row.historique = (row.quantite === b.quantite)
          ? (b.catalogue.historique || []).map(h=>({date: h.date, pa: h.pa}))
          : [];
      }
      // le PV pouvait autrefois être unique pour tout le produit : on le reporte sur chaque
      // ligne de quantité existante (elles pourront ensuite être ajustées indépendamment)
      if(row.pv === undefined || row.pv === null || row.pv === ''){
        row.pv = b.catalogue.pv;
      }
    });
    (b.offres || []).forEach(o=>{
      if(!o.prix || !o.prix.length){
        o.prix = [{id: uid(), quantite: b.quantite, pa: o.pa, frais: o.frais || 0}];
      }
      o.prix.forEach(row=>{ if(!row.historique) row.historique = []; });
    });
    return b;
  }
  function migrateClientBlocks(blocks){
    (blocks || []).forEach(migrateBlockPricing);
    return blocks;
  }

  async function loadAll(){
    try{
      const res = await dualGet('pricing_clients');
      clients = res ? JSON.parse(res.value) : [];
    }catch(e){ clients = []; }
    if(clients.length === 0){
      clients = ["Client A", "Client B"];
      await dualSet('pricing_clients', JSON.stringify(clients));
      data["Client A"] = migrateClientBlocks(sampleA());
      data["Client B"] = migrateClientBlocks(sampleB());
      await saveClient("Client A");
      await saveClient("Client B");
    } else {
      for(const c of clients){
        try{
          const r = await dualGet('pricing_data:'+c);
          data[c] = migrateClientBlocks(r ? JSON.parse(r.value) : []);
        }catch(e){ data[c] = []; }
      }
    }
    currentClient = clients[0];
    try{
      const rl = await dualGet('pricing_last_client');
      if(rl && clients.includes(rl.value)) currentClient = rl.value;
    }catch(e){ /* pas de préférence enregistrée */ }
    try{
      const rs = await dualGet('pricing_seuils');
      if(rs) seuils = Object.assign(seuils, JSON.parse(rs.value));
    }catch(e){ /* pas de seuils enregistrés, valeurs par défaut */ }
    try{
      const rt = await dualGet('pricing_templates');
      templates = rt ? JSON.parse(rt.value) : [];
    }catch(e){ templates = []; }
    try{
      const rtodo = await dualGet('pricing_todos');
      todos = rtodo ? JSON.parse(rtodo.value) : [];
    }catch(e){ todos = []; }
    try{
      const rarch = await dualGet('pricing_archived_clients');
      archivedClients = rarch ? JSON.parse(rarch.value) : [];
    }catch(e){ archivedClients = []; }
    if(archivedClients.includes(currentClient)){
      const firstActif = clients.find(c=>!archivedClients.includes(c));
      if(firstActif) currentClient = firstActif;
    }
  }
  async function saveArchivedClients(){
    if(!requireEditor()) return;
    try{ await dualSet('pricing_archived_clients', JSON.stringify(archivedClients)); }catch(e){ /* non bloquant */ }
  }
  async function saveTemplates(){
    if(!requireEditor()) return;
    try{ await dualSet('pricing_templates', JSON.stringify(templates)); }catch(e){ /* non bloquant */ }
  }
  async function saveTodos(){
    if(!requireEditor()) return;
    try{ await dualSet('pricing_todos', JSON.stringify(todos)); }catch(e){ /* non bloquant */ }
  }
  function addTodoIfNotExists(type, block, client, reason){
    const already = todos.some(t=>t.type===type && t.blockId===block.id && t.status==='pending' && t.reason===reason);
    if(already) return;
    todos.unshift({ id: uid(), type, blockId: block.id, client, produit: block.produit, categorie: block.categorie, date: today(), status: 'pending', reason });
  }
  function removePendingTodo(type, blockId){
    todos = todos.filter(t=>!(t.type===type && t.blockId===blockId && t.status==='pending'));
  }
  function rememberLastClient(c){
    try{ dualSet('pricing_last_client', c); }catch(e){ /* non bloquant */ }
  }

  let wasSyncOk = true;
  async function saveClient(name){
    if(!requireEditor()) return;
    try{
      const result = await dualSet('pricing_data:'+name, JSON.stringify(data[name] || []));
      if(!result){
        if(wasSyncOk) showBanner("Claude est indisponible pour l'instant : vos données sont enregistrées sur cet ordinateur (secours local) et se resynchroniseront automatiquement dès que possible. Rien n'est perdu, mais évitez de changer de navigateur/appareil avant la resynchronisation.", 'info');
        wasSyncOk = false;
        pulseSaved();
        registerChange();
        return;
      }
      wasSyncOk = true;
      pulseSaved();
      registerChange();
    }catch(e){
      console.error('save failed', e);
      showBanner("L'enregistrement a échoué complètement (y compris en local) : " + (e && e.message ? e.message : 'erreur inconnue') + ". Si vous venez de joindre un fichier, réduisez sa taille et réessayez.", 'error');
    }
  }
  async function saveClientsList(){
    if(!requireEditor()) return;
    try{ await dualSet('pricing_clients', JSON.stringify(clients)); }catch(e){}
  }
  async function renameClientTo(oldName, newName){
    data[newName] = data[oldName];
    delete data[oldName];
    const idx = clients.indexOf(oldName);
    if(idx > -1) clients[idx] = newName;
    if(currentClient === oldName) currentClient = newName;
    try{
      await dualSet('pricing_data:'+newName, JSON.stringify(data[newName] || []));
      try{ await fbDb.collection('catalogueData').doc('pricing_data:'+oldName).delete(); }catch(e){ /* ancienne clé déjà absente, sans gravité */ }
      await saveClientsList();
      pulseSaved();
    }catch(e){
      console.error('rename failed', e);
      showBanner("Le renommage a échoué : " + (e && e.message ? e.message : 'erreur inconnue') + ".", 'error');
    }
  }
  function openArchiveClientModal(name){
    const nb = (data[name] || []).length;
    const modal = document.getElementById('exportModal');
    modal.innerHTML = `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" style="max-width:440px;">
          <div class="modal-head"><h3>Archiver « ${escapeHtml(name)} » ?</h3><button class="ghost" id="modalClose">Fermer ✕</button></div>
          <div class="modal-body">
            <p>Ce client (${nb} produit${nb>1?'s':''}) sera masqué de la liste principale, mais toutes ses données seront conservées. Vous pourrez le restaurer à tout moment depuis « clients archivés » en bas de la liste.</p>
          </div>
          <div class="modal-actions">
            <button class="primary" id="archiveConfirm">Archiver ce client</button>
            <button class="ghost" id="modalCancel">Annuler</button>
          </div>
        </div>
      </div>
    `;
    const close = ()=>{ modal.innerHTML=''; };
    document.getElementById('modalClose').onclick = close;
    document.getElementById('modalCancel').onclick = close;
    document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') close(); });
    document.getElementById('archiveConfirm').onclick = async ()=>{
      archivedClients.push(name);
      await saveArchivedClients();
      if(currentClient === name){
        const firstActif = clients.find(c=>!archivedClients.includes(c));
        currentClient = firstActif || null;
      }
      logActivity(`Client archivé : ${name}`);
      showBanner(`« ${name} » a été archivé ✓`, 'info');
      close();
      renderAll();
    };
  }

  function openDeleteClientModal(name){
    const nb = (data[name] || []).length;
    const modal = document.getElementById('exportModal');
    modal.innerHTML = `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" style="max-width:460px;">
          <div class="modal-head"><h3 style="color:var(--bad);">Supprimer « ${escapeHtml(name)} » définitivement ?</h3><button class="ghost" id="modalClose">Fermer ✕</button></div>
          <div class="modal-body">
            <p><b>Cette action est irréversible.</b> Le client « ${escapeHtml(name)} » et l'ensemble de ${nb>0 ? `ses ${nb} produit${nb>1?'s':''}` : 'son catalogue'} (fournisseurs comparés, historique de prix, tout inclus) seront définitivement supprimés. Si vous n'êtes pas sûre, préférez plutôt « Archiver ce client », qui reste réversible.</p>
            <label style="display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:13px;margin-top:10px;cursor:pointer;">
              <input type="checkbox" id="deleteConfirmCheck">
              Je comprends que cette suppression est définitive.
            </label>
          </div>
          <div class="modal-actions">
            <button class="primary" id="deleteConfirm" style="background:var(--bad);border-color:var(--bad);" disabled>Supprimer définitivement</button>
            <button class="ghost" id="modalCancel">Annuler</button>
          </div>
        </div>
      </div>
    `;
    const close = ()=>{ modal.innerHTML=''; };
    document.getElementById('modalClose').onclick = close;
    document.getElementById('modalCancel').onclick = close;
    document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') close(); });
    const confirmBtn = document.getElementById('deleteConfirm');
    document.getElementById('deleteConfirmCheck').onchange = (e)=>{ confirmBtn.disabled = !e.target.checked; };
    confirmBtn.onclick = async ()=>{
      delete data[name];
      clients = clients.filter(c=>c!==name);
      archivedClients = archivedClients.filter(c=>c!==name);
      try{ await fbDb.collection('catalogueData').doc('pricing_data:'+name).delete(); }catch(e){ /* clé déjà absente ou non supportée, sans gravité */ }
      await saveClientsList();
      await saveArchivedClients();
      if(currentClient === name){
        const firstActif = clients.find(c=>!archivedClients.includes(c));
        currentClient = firstActif || null;
      }
      logActivity(`Client supprimé définitivement : ${name} (${nb} produit(s))`);
      showBanner(`« ${name} » a été supprimé définitivement.`, 'info');
      close();
      renderAll();
    };
  }

  function openArchivedClientsModal(){
    const modal = document.getElementById('exportModal');
    modal.innerHTML = `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" style="max-width:480px;">
          <div class="modal-head"><h3>Clients archivés</h3><button class="ghost" id="modalClose">Fermer ✕</button></div>
          <div class="modal-body">
            ${archivedClients.length === 0 ? `<div class="empty">Aucun client archivé pour l'instant.</div>` : `
            <div class="supplier-list">
              ${archivedClients.map(c=>{
                const nb = (data[c] || []).length;
                return `
                <div class="sidebar-client-row" style="background:var(--card);border:1px solid var(--paper-line);border-radius:8px;margin-bottom:4px;padding:2px 4px;">
                  <span style="flex:1;padding:8px 10px;font-family:var(--sans);font-size:14px;">${escapeHtml(c)} <span class="sidebar-client-count" style="background:var(--paper);">${nb}</span></span>
                  <button class="sidebar-client-edit" data-restoreclient="${escapeHtml(c)}" title="Restaurer ce client" style="color:var(--good);">↩ Restaurer</button>
                  <button class="sidebar-client-edit" data-deleteclient="${escapeHtml(c)}" title="Supprimer définitivement" style="color:var(--bad);">🗑</button>
                </div>
              `;}).join('')}
            </div>`}
          </div>
          <div class="modal-actions">
            <button class="ghost" id="modalCancel">Fermer</button>
          </div>
        </div>
      </div>
    `;
    const close = ()=>{ modal.innerHTML=''; };
    document.getElementById('modalClose').onclick = close;
    document.getElementById('modalCancel').onclick = close;
    document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') close(); });
    modal.querySelectorAll('[data-restoreclient]').forEach(btn=>{
      btn.onclick = async ()=>{
        const c = btn.getAttribute('data-restoreclient');
        archivedClients = archivedClients.filter(x=>x!==c);
        await saveArchivedClients();
        logActivity(`Client restauré : ${c}`);
        showBanner(`« ${c} » a été restauré ✓`, 'info');
        close();
        renderAll();
      };
    });
    modal.querySelectorAll('[data-deleteclient]').forEach(btn=>{
      btn.onclick = ()=>{
        const c = btn.getAttribute('data-deleteclient');
        close();
        openDeleteClientModal(c);
      };
    });
  }

  function pulseSaved(){
    const p = document.getElementById('savePill');
    p.textContent = 'Enregistré ✓';
    p.classList.add('show');
    clearTimeout(pulseSaved._t);
    pulseSaved._t = setTimeout(()=>p.classList.remove('show'), 1500);
  }

  function sampleA(){
    return [
      {id: uid(), categorie:"Goodies", produit:"Clé USB 16Go bambou", technique:"Gravure laser", finitions:"Boîte kraft", quantite:500,
       catalogue:{fournisseur:"Fournisseur Dupont", pa:2.10, pv:4.90, date:"2025-03-12"},
       offres:[
         {id:uid(), fournisseur:"Fournisseur Lin&Co", pa:1.85, retenu:true},
         {id:uid(), fournisseur:"Fournisseur Meng", pa:1.95, retenu:false},
       ]},
      {id: uid(), categorie:"PLV", produit:"Totem carton 1m80", technique:"Impression numérique", finitions:"Pelliculage mat", quantite:20,
       catalogue:{fournisseur:"Fournisseur Cartonex", pa:38.00, pv:79.00, date:"2025-01-05"},
       offres:[
         {id:uid(), fournisseur:"Fournisseur Cartonex", pa:33.50, retenu:false},
       ]},
    ];
  }

    return [
      {id: uid(), categorie:"Print", produit:"Flyer A5 recto/verso", technique:"Offset quadri", finitions:"Vernis sélectif", quantite:5000,
       catalogue:{fournisseur:"Fournisseur Imprimex", pa:0.09, pv:0.22, date:"2025-02-10"},
       offres:[
         {id:uid(), fournisseur:"Fournisseur PrintFast", pa:0.07, retenu:true},
       ]},
    ];
  }

  // ---- calculs ----
  function buildSupplierMatrixHTML(b){
    const sources = [
      { key:'catalogue', label: b.catalogue.fournisseur, reference: b.catalogue.reference, lien: b.catalogue.lien,
        devis: b.catalogue.devis, devisValidite: b.catalogue.devisValidite, prix: b.catalogue.prix || [],
        finitions: b.finitions || '', date: b.catalogue.date || '',
        editable:false, offerId:'', isRetenu: !b.offres.some(o=>o.retenu) },
      ...b.offres.map(o=>({
        key:o.id, label:o.fournisseur, reference:o.reference, lien:o.lien, devis:o.devis, devisValidite:o.devisValidite,
        prix:o.prix||[], finitions: (o.finitions !== undefined ? o.finitions : (b.finitions || '')), date: o.date || '',
        editable:true, offerId:o.id, isRetenu: !!o.retenu
      }))
    ];
    const qtySet = new Set();
    sources.forEach(s=>s.prix.forEach(p=>qtySet.add(p.quantite)));
    const quantites = Array.from(qtySet).sort((x,y)=>x-y);
    const isPrint = b.categorie === 'Print';
    const isTextile = b.categorie === 'Textile';
    const nbCols = isTextile ? 6 : 5;
    const pvAtQty = (qty)=>{
      const row = (b.catalogue.prix||[]).find(p=>p.quantite===qty);
      return (row && row.pv !== undefined && row.pv !== null && row.pv !== '') ? row.pv : (b.catalogue.pv || 0);
    };

    const calcCell = (row, qty, pv)=>{
      const pa = row ? row.pa : 0;
      const frais = row ? (row.frais||0) : 0;
      const fraisTech = row ? (row.fraisTechnique||0) : 0;
      const fraisUnit = isPrint ? frais : (qty ? frais/qty : 0);
      const fraisTechUnit = (isTextile && qty) ? fraisTech/qty : 0;
      const totalHT = isPrint ? (pa + frais) : (pa*qty + frais + (isTextile ? fraisTech : 0));
      const coutUnit = pa + fraisUnit + fraisTechUnit;
      const margeUnitaire = pv - coutUnit;
      const margeGlobale = isPrint ? margeUnitaire : margeUnitaire * qty;
      const coef = coutUnit ? pv/coutUnit : 0;
      return {pa, frais, fraisTech, totalHT, pv, margeGlobale, coef, hasData: !!row};
    };

    return `
      <div class="matrix-scroll">
      <table class="supplier-matrix">
        <thead>
          <tr>
            <th class="qty-head" rowspan="3">Quantité</th>
            <th class="pv-head" rowspan="3">PV</th>
            ${sources.map(s=>`<th colspan="${nbCols}" class="supplier-head ${s.isRetenu?'retenu-col':''}">
              <div class="supplier-head-row">
                <span class="supplier-name-inline">${escapeHtml(s.label)}</span>
                <span class="supplier-head-right">
                  ${s.date ? `<span class="supplier-date-inline" title="Prix validé le">${fmtDate(s.date)}</span>` : ''}
                  ${s.editable ? `
                    <button type="button" class="icon-btn" data-action="modifier-fournisseur" data-block="${b.id}" data-offer="${s.offerId}" title="Modifier ce fournisseur">✎</button>
                    <button type="button" class="icon-btn" data-action="suppr-fournisseur" data-block="${b.id}" data-offer="${s.offerId}" title="Retirer ce fournisseur">✕</button>
                  ` : `
                    <button type="button" class="icon-btn" data-action="modifier-bloc" data-block="${b.id}" title="Modifier le fournisseur initial">✎</button>
                  `}
                </span>
              </div>
            </th>`).join('')}
          </tr>
          <tr>
            ${sources.map(s=>`<th colspan="${nbCols}" class="supplier-ref-head ${s.isRetenu?'retenu-col':''}">
              <div class="supplier-ref-row">
                <span class="supplier-ref-left">
                  ${s.lien ? `<a href="${escapeHtml(s.lien)}" target="_blank" rel="noopener">${escapeHtml(s.reference||'Référence')}</a>` : escapeHtml(s.reference || '—')}
                  ${devisIcon(s.devis, s.devisValidite)}
                </span>
                <span class="supplier-finitions">${escapeHtml(s.finitions || '—')}</span>
              </div>
              <label class="retenu-label"><input type="radio" name="retenu-${b.id}" data-action="retenir-matrix" data-block="${b.id}" data-offer="${s.offerId}" ${s.isRetenu?'checked':''}> Retenir</label>
            </th>`).join('')}
          </tr>
          <tr class="subheader-row">
            ${sources.map(s=>`<th class="${s.isRetenu?'retenu-col':''}">PA</th><th class="${s.isRetenu?'retenu-col':''}" title="Frais de port">FDP</th>${isTextile ? `<th class="${s.isRetenu?'retenu-col':''}" title="Frais technique (divisé par la quantité)">FT</th>` : ''}<th class="${s.isRetenu?'retenu-col':''}">Total HT</th><th class="${s.isRetenu?'retenu-col':''}" title="Marge globale">Marge</th><th class="${s.isRetenu?'retenu-col':''}">Coef.</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${quantites.length === 0 ? `<tr><td colspan="${2+sources.length*nbCols}" class="empty-cell" style="padding:16px;">Aucune ligne de prix pour l'instant — ajoutez une quantité ci-dessous.</td></tr>` : quantites.map(q=>{
            const pv = pvAtQty(q);
            const cellsPerSource = sources.map(s=>{
              const row = s.prix.find(p=>p.quantite===q);
              const calc = calcCell(row, q, pv);
              const cls = s.isRetenu ? 'retenu-col' : '';
              return `
                <td class="num ${cls}"><input type="number" step="0.01" class="matrix-input" data-mfield="pa" data-block="${b.id}" data-offer="${s.offerId}" data-qty="${q}" value="${row ? row.pa : ''}" placeholder="—"></td>
                <td class="num ${cls}"><input type="number" step="0.01" class="matrix-input" data-mfield="frais" data-block="${b.id}" data-offer="${s.offerId}" data-qty="${q}" value="${row ? (row.frais||0) : ''}" placeholder="—"></td>
                ${isTextile ? `<td class="num ${cls}"><input type="number" step="0.01" class="matrix-input" data-mfield="fraisTechnique" data-block="${b.id}" data-offer="${s.offerId}" data-qty="${q}" value="${row ? (row.fraisTechnique||0) : ''}" placeholder="—"></td>` : ''}
                <td class="num ${cls}">${calc.hasData ? fmtE(calc.totalHT) : '—'}</td>
                <td class="num ${cls}" style="${calc.hasData && calc.margeGlobale<0?'color:var(--bad);':''}">${calc.hasData ? fmtE(calc.margeGlobale) : '—'}</td>
                <td class="num ${cls}">${calc.hasData ? calc.coef.toFixed(2)+'x' : '—'}</td>
              `;
            }).join('');
            return `<tr><td class="num qty-cell"><input type="number" class="matrix-input qty-input" data-mfield="qty" data-block="${b.id}" data-oldqty="${q}" value="${q}"><button type="button" class="icon-btn qty-remove" data-action="suppr-quantite" data-block="${b.id}" data-qty="${q}" title="Retirer cette quantité du comparatif">✕</button></td><td class="num pv-cell"><input type="number" step="0.01" class="matrix-input" data-mfield="pv" data-block="${b.id}" data-qty="${q}" value="${pv}"></td>${cellsPerSource}</tr>`;
          }).join('')}
          <tr class="add-qty-row">
            <td class="qty-cell">
              <input type="number" id="newQtyInput-${b.id}" class="matrix-input" placeholder="Qté" style="width:44px;" title="Ex. 2000">
            </td>
            <td></td>
            <td colspan="${sources.length*nbCols}">
              <button type="button" class="link" data-action="ajouter-quantite" data-block="${b.id}">+ Ajouter cette quantité au comparatif</button>
            </td>
          </tr>
        </tbody>
      </table>
      </div>
    `;
  }

  function allQuantitesDuBloc(b){
    const qtySet = new Set();
    (b.catalogue.prix||[]).forEach(p=>qtySet.add(p.quantite));
    b.offres.forEach(o=>(o.prix||[]).forEach(p=>qtySet.add(p.quantite)));
    return Array.from(qtySet).sort((x,y)=>x-y);
  }

  function computeBlock(b, qtyOverride){
    const qty = qtyOverride !== undefined ? qtyOverride : b.quantite;
    const priceAt = (source, q) => {
      const row = (source.prix||[]).find(p=>p.quantite===q);
      return row ? {pa: row.pa, frais: row.frais||0, fraisTechnique: row.fraisTechnique||0} : {pa: source.pa, frais: source.frais||0, fraisTechnique: 0};
    };
    const catPrice = priceAt(b.catalogue, qty);
    const allPrices = [{src:'catalogue', pa:catPrice.pa}, ...b.offres.map(o=>({src:o.id, pa:priceAt(o, qty).pa}))];
    const minPa = Math.min(...allPrices.map(p=>p.pa));
    const retained = b.offres.find(o=>o.retenu);
    const retainedPrice = retained ? priceAt(retained, qty) : catPrice;
    const paRetenu = retainedPrice.pa;
    const fraisRetenu = retainedPrice.frais;
    const fraisTechRetenu = retainedPrice.fraisTechnique;
    const fournRetenu = retained ? retained.fournisseur : b.catalogue.fournisseur;
    const refRetenue = retained ? (retained.reference || '') : (b.catalogue.reference || '');
    const pvRow = (b.catalogue.prix||[]).find(p=>p.quantite===qty);
    const pv = (pvRow && pvRow.pv !== undefined && pvRow.pv !== null && pvRow.pv !== '') ? pvRow.pv : (b.catalogue.pv || 0);
    const isPrint = b.categorie === 'Print';
    const isTextile = b.categorie === 'Textile';
    const fraisParUnite = isPrint ? fraisRetenu : (qty ? fraisRetenu / qty : 0);
    const fraisTechParUnite = (isTextile && qty) ? fraisTechRetenu / qty : 0;
    const coutTotal = paRetenu + fraisParUnite + fraisTechParUnite;
    const marge = pv - coutTotal;
    const margeTotale = isPrint ? marge : marge * qty;
    const coeff = coutTotal ? pv/coutTotal : 0;
    const ecart = paRetenu - catPrice.pa;
    const evolPct = catPrice.pa ? (ecart / catPrice.pa) * 100 : 0;
    return {minPa, retained, paRetenu, fraisRetenu, fraisTechRetenu, fraisParUnite, fraisTechParUnite, coutTotal, fournRetenu, refRetenue, pv, marge, margeTotale, coeff, ecart, evolPct, quantite: qty};
  }

  function fmtE(n){ return (Math.round(n*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }
  function fmtPct(n){ const s = n>0?'+':''; return s + (Math.round(n*10)/10).toLocaleString('fr-FR') + ' %'; }
  function fmtDate(iso){
    if(!iso) return '—';
    const [y,m,d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }
  function today(){ return new Date().toISOString().slice(0,10); }
  const MAX_FILE_SIZE = 3 * 1024 * 1024; // 3 Mo par fichier

  const CAT_COLORS = {
    Goodies: {bg:'#EEE9FE', fg:'#6D3FE0'},
    Textile: {bg:'#E1F5EC', fg:'#1A8A55'},
    PLV:     {bg:'#FEF0DE', fg:'#C2680B'},
    Print:   {bg:'#E3F0FF', fg:'#1A5FD1'},
  };
  function catColorStyle(cat){
    const c = CAT_COLORS[cat] || {bg:'#EEE', fg:'#555'};
    return `background:${c.bg};color:${c.fg};`;
  }

  function buildDonutSVG(catCounts, total){
    const size = 168, r = 60, cx = size/2, cy = size/2, thickness = 26;
    const circumference = 2 * Math.PI * r;
    let offset = 0;
    let circles = '';
    if(total === 0){
      circles = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--paper-line)" stroke-width="${thickness}"/>`;
    } else {
      CATS.forEach(cat=>{
        const count = catCounts[cat] || 0;
        if(count === 0) return;
        const frac = count / total;
        const dash = frac * circumference;
        const color = (CAT_COLORS[cat] || {}).fg || '#999';
        circles += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${thickness}"
          stroke-dasharray="${dash.toFixed(2)} ${(circumference - dash).toFixed(2)}"
          stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
        offset += dash;
      });
    }
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="flex-shrink:0;">
      ${circles}
      <text x="${cx}" y="${cy-3}" text-anchor="middle" font-family="var(--sans)" font-size="24" font-weight="700" fill="var(--ink)">${total}</text>
      <text x="${cx}" y="${cy+16}" text-anchor="middle" font-family="var(--sans)" font-size="10.5" fill="var(--ink-soft)">produit${total>1?'s':''}</text>
    </svg>`;
  }

  function renderGamme(){
    const zone = document.getElementById('gammeView');
    if(currentView !== 'gamme'){ zone.innerHTML=''; return; }
    zone.innerHTML = `
      <div class="actionbar"><h2>Répartition par gamme</h2></div>
      <p style="font-family:var(--sans);font-size:12px;color:var(--ink-soft);margin:-8px 0 18px;">
        Nombre de produits catalogue par catégorie, pour chaque client.
      </p>
      ${clients.length === 0 ? `<div class="empty">Aucun client pour l'instant.</div>` : `
      <div class="gamme-grid">
        ${clients.map(c=>{
          const blocks = (data[c] || []).filter(b=>!b.archived && !b.nouveaute);
          const counts = {};
          CATS.forEach(cat=>counts[cat] = 0);
          blocks.forEach(b=>{ counts[b.categorie] = (counts[b.categorie] || 0) + 1; });
          const total = blocks.length;
          return `
            <div class="gamme-card">
              <h3>${escapeHtml(c)}</h3>
              ${total === 0 ? `<div class="empty" style="padding:20px;">Aucun produit pour ce client.</div>` : `
              <div class="gamme-body">
                ${buildDonutSVG(counts, total)}
                <div class="gamme-legend">
                  ${CATS.map(cat=>{
                    const n = counts[cat] || 0;
                    const pct = total ? Math.round((n/total)*100) : 0;
                    const color = (CAT_COLORS[cat]||{}).fg || '#999';
                    return `
                      <div class="gamme-legend-row" style="${n===0?'opacity:.4;':''}">
                        <span class="gamme-dot" style="background:${color};"></span>
                        <span class="gamme-legend-label">${escapeHtml(cat)}</span>
                        <span class="gamme-legend-pct">${n>0 ? pct+'%' : ''}</span>
                        <span class="gamme-legend-count">${n}</span>
                      </div>`;
                  }).join('')}
                  <div class="gamme-legend-row gamme-total">
                    <span class="gamme-legend-label">Total</span>
                    <span class="gamme-legend-count">${total}</span>
                  </div>
                </div>
              </div>
              `}
            </div>
          `;
        }).join('')}
      </div>
      `}
    `;
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ---- Alertes ----
  const DEVIS_SOON_DAYS = 14;
  function computeAlerts(){
    const marge = [], stale = [], devisExp = [], devisSoon = [], pending = [], notCheapest = [];
    const soonLimit = new Date();
    soonLimit.setDate(soonLimit.getDate() + DEVIS_SOON_DAYS);
    const soonLimitStr = soonLimit.toISOString().slice(0,10);
    clients.forEach(client=>{
      (data[client] || []).filter(b=>!b.nouveaute).forEach(b=>{
        const c = computeBlock(b);
        const taux = c.pv ? (c.marge / c.pv) * 100 : null;
        const seuil = seuils[b.categorie] || 0;
        if(seuil > 0 && taux !== null && taux < seuil){
          marge.push({client, produit: b.produit, categorie: b.categorie, blockId: b.id, detail: `${(Math.round(taux*10)/10)}% (seuil ${seuil}%)`});
        }
        const m = monthsSince(b.catalogue.date);
        if(m !== null && m >= STALE_MONTHS){
          stale.push({client, produit: b.produit, categorie: b.categorie, blockId: b.id, detail: `maj il y a ${m} mois`});
        }
        const checkDevis = (devis, validite, label)=>{
          if(devis && validite && validite < today()){
            devisExp.push({client, produit: b.produit, categorie: b.categorie, blockId: b.id, detail: `${label} expiré le ${fmtDate(validite)}`});
          } else if(devis && validite && validite >= today() && validite <= soonLimitStr){
            devisSoon.push({client, produit: b.produit, categorie: b.categorie, blockId: b.id, detail: `${label} expire le ${fmtDate(validite)}`});
          }
        };
        checkDevis(b.catalogue.devis, b.catalogue.devisValidite, 'Devis catalogue');
        b.offres.forEach(o=>checkDevis(o.devis, o.devisValidite, `Devis ${o.fournisseur}`));
        if(b.offres.length > 0 && !b.offres.some(o=>o.retenu)){
          pending.push({client, produit: b.produit, categorie: b.categorie, blockId: b.id, detail: `${b.offres.length} offre(s) en attente de décision`});
        }
        if(!b.archived && c.minPa != null && c.paRetenu > c.minPa + 0.0001){
          notCheapest.push({client, produit: b.produit, categorie: b.categorie, blockId: b.id, detail: `${c.fournRetenu} à ${fmtE(c.paRetenu)} vs ${fmtE(c.minPa)} au moins cher`});
        }
      });
    });
    return {marge, stale, devisExp, devisSoon, pending, notCheapest};
  }

  function alertSectionHTML(title, entries, emptyMsg){
    return `
      <div class="alert-section">
        <h3>${title} <span class="alert-count">${entries.length}</span></h3>
        ${entries.length === 0 ? `<p class="alert-empty">${emptyMsg}</p>` : `
        <div class="alert-list">
          ${entries.map(e=>`
            <button class="alert-row" data-alertclient="${escapeHtml(e.client)}" data-alertblock="${e.blockId}">
              <span class="tag" style="${catColorStyle(e.categorie)}">${escapeHtml(e.categorie)}</span>
              <span class="alert-produit">${escapeHtml(e.produit)}</span>
              <span class="alert-client-name">${escapeHtml(e.client)}</span>
              <span class="alert-detail">${escapeHtml(e.detail)}</span>
            </button>
          `).join('')}
        </div>`}
      </div>
    `;
  }

  function renderAlertes(){
    const zone = document.getElementById('alertesView');
    if(currentView !== 'alertes'){ zone.innerHTML=''; return; }
    const a = computeAlerts();
    zone.innerHTML = `
      <div class="actionbar"><h2>Alertes</h2></div>
      <p style="font-family:var(--sans);font-size:12px;color:var(--ink-soft);margin:-8px 0 18px;">
        Tout ce qui mérite votre attention, centralisé pour l'ensemble de vos clients. Cliquez sur une ligne pour ouvrir le produit concerné.
      </p>
      ${alertSectionHTML('Marge sous le seuil', a.marge, 'Aucun produit sous son seuil de marge — RAS.')}
      ${alertSectionHTML('Prix non mis à jour depuis longtemps', a.stale, 'Tous vos prix catalogue ont été mis à jour récemment.')}
      ${alertSectionHTML('Devis expirés', a.devisExp, "Aucun devis joint n'a dépassé sa date de validité.")}
      ${alertSectionHTML(`Devis bientôt expirés (${DEVIS_SOON_DAYS} j)`, a.devisSoon, "Aucun devis n'expire dans les prochains jours.")}
      ${alertSectionHTML('Offres en attente de décision', a.pending, 'Aucune offre fournisseur en attente — tout est tranché.')}
      ${alertSectionHTML('Fournisseur retenu non le moins cher', a.notCheapest, 'Le fournisseur retenu est toujours le moins cher à la quantité de référence.')}

    zone.querySelectorAll('[data-alertclient]').forEach(btn=>{
      btn.onclick = ()=>{
        const client = btn.getAttribute('data-alertclient');

        categoryFilter = 'Toutes'; supplierFilter = 'Tous'; searchQuery = '';
        expandedBlocks.add(blockId);
        rememberLastClient(client);
        renderAll();
        setTimeout(()=>{
          const el = document.querySelector(`[data-block-id="${blockId}"]`);
          if(el){
            el.scrollIntoView({behavior:'smooth', block:'center'});
            el.classList.add('block-highlight');
            setTimeout(()=>el.classList.remove('block-highlight'), 2000);
          }
        }, 60);
      };
    });
  }

  // ---- Comparateur inter-clients ----
  function computeCrossClientMatches(){
    const groups = {};
    clients.forEach(client=>{
      (data[client] || []).filter(b=>!b.archived && !b.nouveaute).forEach(b=>{
        const c = computeBlock(b);
        const fourn = (c.fournRetenu || '').trim();
        const ref = (c.refRetenue || '').trim();
        const technique = (b.technique || '').trim();
        if(!fourn || !ref || ref === '—') return; // il faut un fournisseur ET une référence pour rapprocher deux produits
        const key = [fourn.toLowerCase(), ref.toLowerCase(), b.quantite, technique.toLowerCase()].join('|');
        if(!groups[key]) groups[key] = [];
        groups[key].push({client, produit: b.produit, categorie: b.categorie, fournisseur: c.fournRetenu, reference: c.refRetenue, quantite: b.quantite, technique, pa: c.paRetenu, pv: c.pv, marge: c.marge, blockId: b.id});
      });
    });
    return Object.values(groups).filter(g => new Set(g.map(e=>e.client)).size >= 2);
  }

  function renderComparateur(){
    const zone = document.getElementById('comparateurView');
    if(currentView !== 'comparateur'){ zone.innerHTML=''; return; }
    const groups = computeCrossClientMatches();
    zone.innerHTML = `
      <div class="actionbar"><h2>Comparateur inter-clients</h2></div>
      <p style="font-family:var(--sans);font-size:12px;color:var(--ink-soft);margin:-8px 0 18px;">
        Même fournisseur, même référence, même quantité et même technique de marquage retrouvés chez au moins deux clients différents — utile pour repérer des écarts de prix ou négocier des volumes groupés.
      </p>
      ${groups.length === 0 ? `<div class="empty">Aucune correspondance fournisseur + référence commune entre vos clients pour l'instant.</div>` : groups.map(g=>{
        const prices = g.map(e=>e.pa);
        const minPa = Math.min(...prices), maxPa = Math.max(...prices);
        return `
        <div class="gamme-card" style="margin-bottom:14px;">
          <h3><span class="tag" style="${catColorStyle(g[0].categorie)}">${escapeHtml(g[0].categorie)}</span> ${escapeHtml(g[0].fournisseur)} <span style="color:var(--ink-soft);font-weight:400;font-size:13px;">· réf. ${escapeHtml(g[0].reference)} · qté ${g[0].quantite} · ${escapeHtml(g[0].technique || '—')}</span></h3>
          <table class="synth">
            <thead><tr><th>Client</th><th>Produit</th><th>PA</th><th>PV</th><th>Marge</th></tr></thead>
            <tbody>
              ${g.map(e=>`
                <tr>
                  <td class="client">${escapeHtml(e.client)}</td>
                  <td>${escapeHtml(e.produit)}</td>
                  <td class="num ${e.pa===minPa && minPa!==maxPa ? 'best' : ''}" style="${e.pa===minPa && minPa!==maxPa ? 'color:var(--good);font-weight:700;' : ''}">${fmtE(e.pa)}</td>
                  <td class="num">${fmtE(e.pv)}</td>
                  <td class="num">${fmtE(e.marge)}</td>
                </tr>
              `).join('')}

  function readFileAsDataURL(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = ()=>reject(new Error('Impossible de lire ce fichier.'));
      reader.readAsDataURL(file);
    });
  }
  // Lit le fichier choisi dans un <input type=file> ; renvoie undefined si aucun fichier
  // (= ne rien changer), ou {name,type,size,data} ; lève une erreur si le fichier est trop lourd.
  async function readAttachedFile(inputEl){
    const file = inputEl && inputEl.files && inputEl.files[0];
    if(!file) return undefined;
    if(file.size > MAX_FILE_SIZE){
      throw new Error(`Le fichier "${file.name}" fait ${(file.size/1024/1024).toFixed(1)} Mo, ce qui dépasse la limite de 3 Mo. Compressez-le (photo) ou réduisez sa résolution (scan) et réessayez.`);
    }
    const data = await readFileAsDataURL(file);
    return {name: file.name, type: file.type, size: file.size, data};
  }

    if(!dateStr) return null;
    const d = new Date(dateStr);

  function calcSynthese(clientName){
    const blocks = (data[clientName] || []).filter(b=>!b.archived && !b.nouveaute);
    const nbProduits = blocks.length;
    let nbAnalyses = 0, sumEvol = 0, nbHausses10 = 0, dernMaj = null;
    blocks.forEach(b=>{
      if(b.catalogue.date && (!dernMaj || b.catalogue.date > dernMaj)) dernMaj = b.catalogue.date;
      b.offres.forEach(o=>{
        nbAnalyses++;
        const evol = b.catalogue.pa ? ((o.pa - b.catalogue.pa) / b.catalogue.pa) * 100 : 0;
        sumEvol += evol;
        if(evol > 10) nbHausses10++;
      });
    });
    const evolMoyenne = nbAnalyses ? sumEvol / nbAnalyses : null;
    return {nbProduits, nbAnalyses, evolMoyenne, nbHausses10, dernMaj};
  }

  function calcRentabilite(clientName){
    const blocks = (data[clientName] || []).filter(b=>!b.archived && !b.nouveaute);
    let sumTaux = 0, nbAvecMarge = 0, nbSousSeuil = 0;
    const parCategorie = {};
    CATS.forEach(cat=>{ parCategorie[cat] = { sum: 0, nb: 0 }; });
    blocks.forEach(b=>{
      const c = computeBlock(b);
      if(c.pv){
        const taux = (c.marge / c.pv) * 100;
        sumTaux += taux;
        nbAvecMarge++;
        if(parCategorie[b.categorie]){
          parCategorie[b.categorie].sum += taux;
          parCategorie[b.categorie].nb++;
        }
      }
      const seuil = seuils[b.categorie] || 0;
      const taux2 = c.pv ? (c.marge / c.pv) * 100 : null;
      if(seuil > 0 && taux2 !== null && taux2 < seuil) nbSousSeuil++;
    });
    const margeMoyenne = nbAvecMarge ? sumTaux / nbAvecMarge : null;
    const margeParCategorie = {};
    CATS.forEach(cat=>{
      margeParCategorie[cat] = parCategorie[cat].nb ? parCategorie[cat].sum / parCategorie[cat].nb : null;
    });
    return { nbProduits: blocks.length, margeMoyenne, nbSousSeuil, margeParCategorie };
  }

  let fournCategoryFilter = 'Toutes';

  function computeSupplierStats(){
    const map = {};
    clients.forEach(client=>{
      (data[client] || []).filter(b=>!b.archived && !b.nouveaute).forEach(b=>{
        const c = computeBlock(b);
        const retainedOffer = b.offres.find(o=>o.retenu);
        const source = retainedOffer || b.catalogue;
        const reference = source.reference || '';
        const fourn = c.fournRetenu || '—';
        if(!map[fourn]) map[fourn] = [];
        const prixRows = (source.prix && source.prix.length) ? source.prix : [{quantite: b.quantite, pa: c.paRetenu}];
        prixRows.forEach(p=>{
          map[fourn].push({
            blockId: b.id, client, produit: b.produit, categorie: b.categorie, quantite: p.quantite,
            pa: p.pa, reference
          });
        });
      });
    });
    return map;
  }

  function filterFournEntries(list, query){
    const q = query.trim().toLowerCase();
    if(!q) return list;
    return list.filter(e => (e.produit||'').toLowerCase().includes(q) || (e.reference||'').toLowerCase().includes(q));
  }

  const FOURN_COLS = [
    {key:'client', label:'Client'},
    {key:'categorie', label:'Catégorie'},
    {key:'produit', label:'Produit'},
    {key:'reference', label:'Référence'},
  ];
  function fournColValue(e, col){ return col === 'reference' ? (e.reference || '—') : e[col]; }

  function fournColumnOptions(rawList, col){
    let list = rawList;
    FOURN_COLS.forEach(({key})=>{
      if(key === col) return;
      const filt = fournColumnFilters[key];
      if(filt) list = list.filter(e => filt.has(fournColValue(e, key)));
    });
    const values = new Set(list.map(e => fournColValue(e, col)));
    return Array.from(values).sort((a,b)=>String(a).localeCompare(String(b), 'fr'));
  }

  function fournApplyColumnFilters(rawList){
    let list = rawList;
    FOURN_COLS.forEach(({key})=>{
      const filt = fournColumnFilters[key];
      if(filt) list = list.filter(e => filt.has(fournColValue(e, key)));
    });
    if(fournSort.col){
      list = list.slice().sort((a,b)=>{
        let va = fournSort.col==='quantite' ? a.quantite : fournSort.col==='pa' ? a.pa : fournColValue(a, fournSort.col);
        let vb = fournSort.col==='quantite' ? b.quantite : fournSort.col==='pa' ? b.pa : fournColValue(b, fournSort.col);
        if(typeof va === 'number' && typeof vb === 'number') return (va-vb) * fournSort.dir;
        return String(va).localeCompare(String(vb), 'fr') * fournSort.dir;
      });
    }
    return list;
  }

  function sortArrow(col){
    if(fournSort.col !== col) return '';
    return fournSort.dir === 1 ? ' ▲' : ' ▼';
  }

  function colHeaderHTML(col, label, rawList){
    const filt = fournColumnFilters[col];
    const active = !!filt;
    const isOpen = openFilterColumn === col;
    const options = fournColumnOptions(rawList, col);
    return `
      <th>
        <span class="colfilter-wrap">
          <span class="colsort-label" data-colsort="${col}" style="cursor:pointer;">${label}${sortArrow(col)}</span>
          <button class="colfilter-btn ${active?'active':''}" data-colfilter="${col}" title="Filtrer">▾</button>
          ${isOpen ? `
          <div class="colfilter-panel" onclick="event.stopPropagation()">
            <div class="colfilter-actions">
              <button class="link" data-colall="${col}">Tout</button>
              <button class="link" data-colnone="${col}">Aucun</button>
              ${active ? `<button class="link" data-colreset="${col}" style="color:var(--bad);">Réinitialiser</button>` : ''}

  function fournDetailTableHTML(rawList){
    const finalList = fournApplyColumnFilters(rawList);

      groupIndex[e.blockId].rows.push({ quantite: e.quantite, pa: e.pa });

  function attachFournDetailHandlers(){
    const body = document.getElementById('fournDetailBody');
    if(!body) return;
    body.querySelectorAll('[data-fourngroup]').forEach(row=>{
      row.onclick = ()=>{
        const id = row.getAttribute('data-fourngroup');
        if(expandedFournProducts.has(id)) expandedFournProducts.delete(id);
        else expandedFournProducts.add(id);
        updateFournDetail();
      };
    });
    body.querySelectorAll('[data-colsort]').forEach(el=>{
      el.onclick = ()=>{
        const col = el.getAttribute('data-colsort');
        if(fournSort.col === col) fournSort.dir *= -1;
        else { fournSort.col = col; fournSort.dir = 1; }
        updateFournDetail();
      };
    });
    body.querySelectorAll('[data-colfilter]').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const col = btn.getAttribute('data-colfilter');
        openFilterColumn = (openFilterColumn === col) ? null : col;
        updateFournDetail();
      };
    });
    body.querySelectorAll('[data-colvalue]').forEach(cb=>{
      cb.onchange = ()=>{
        const col = cb.getAttribute('data-colvalue');
        const boxes = body.querySelectorAll(`[data-colvalue="${col}"]`);
        const checkedVals = new Set();
        boxes.forEach(box=>{ if(box.checked) checkedVals.add(box.value); });

        updateFournDetail();
      };

    body.querySelectorAll('[data-colall]').forEach(btn=>{
      btn.onclick = ()=>{ fournColumnFilters[btn.getAttribute('data-colall')] = null; updateFournDetail(); };

  function updateFournDetail(){
    const map = computeSupplierStats();
