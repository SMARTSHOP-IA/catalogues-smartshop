  function computeHistoryEntries(){
    const entries = [];
    clients.forEach(client=>{
      (data[client] || []).filter(b=>!b.archived && !b.nouveaute).forEach(b=>{
        const rows = (b.catalogue.prix && b.catalogue.prix.length)
          ? b.catalogue.prix
          : [{quantite: b.quantite, pa: b.catalogue.pa, historique: b.catalogue.historique || [], dateMaj: b.catalogue.date}];
        const quantityHistories = rows.slice().sort((r1,r2)=>r1.quantite-r2.quantite).map(row=>{
          const cb = computeBlock(b, row.quantite);
          const past = (row.historique || []).map(h=>({date: h.date, pa: h.pa, fournisseur: h.fournisseur || b.catalogue.fournisseur, current: false}));
          const full = [
            { date: row.dateMaj || b.catalogue.date, pa: cb.paRetenu, fournisseur: cb.fournRetenu, current: true },
            ...past
          ].sort((a,b2)=> (b2.date||'').localeCompare(a.date||''));
          return { quantite: row.quantite, nbMaj: past.length, history: full };
        });
        const nbMajTotal = quantityHistories.reduce((s,q)=>s+q.nbMaj, 0);
        entries.push({
          blockId: b.id, client, categorie: b.categorie, produit: b.produit,
          fournisseurActuel: b.catalogue.fournisseur, paActuel: b.catalogue.pa,
          dateActuelle: b.catalogue.date, nbMaj: nbMajTotal, quantityHistories,
          retenuHistorique: (b.retenuHistorique || []).slice().sort((a,b2)=>(b2.date||'').localeCompare(a.date||''))
        });
      });
    });
    return entries;
  }

  function buildLineChartSVG(history){
    // history est trié du plus récent au plus ancien : on l'inverse pour tracer chronologiquement
    const pts = history.slice().reverse().filter(h=>h.date);
    if(pts.length < 2) return '';
    const w = 480, h = 120, padL = 44, padR = 16, padT = 14, padB = 24;
    const values = pts.map(p=>p.pa);
    const minV = Math.min(...values), maxV = Math.max(...values);
    const range = (maxV - minV) || 1;
    const x = i => padL + (i/(pts.length-1)) * (w - padL - padR);
    const y = v => padT + (1 - (v - minV)/range) * (h - padT - padB);
    const pathD = pts.map((p,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(p.pa).toFixed(1)}`).join(' ');
    const dots = pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.pa).toFixed(1)}" r="3.5" fill="var(--cyan)"/>`).join('');
    const labels = pts.map((p,i)=>{
      if(pts.length > 6 && i % Math.ceil(pts.length/6) !== 0 && i !== pts.length-1) return '';
      return `<text x="${x(i).toFixed(1)}" y="${h-6}" text-anchor="middle" font-family="var(--sans)" font-size="9" fill="var(--ink-soft)">${fmtDate(p.date).slice(0,5)}</text>`;
    }).join('');
    return `
      <div style="background:var(--card);padding:8px 0 4px;">
        <svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:520px;display:block;background:var(--card);">
          <text x="${padL-6}" y="${y(maxV).toFixed(1)}" text-anchor="end" font-family="var(--sans)" font-size="10" fill="var(--ink-soft)">${fmtE(maxV)}</text>
          <text x="${padL-6}" y="${y(minV).toFixed(1)}" text-anchor="end" font-family="var(--sans)" font-size="10" fill="var(--ink-soft)">${fmtE(minV)}</text>
          <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="var(--paper-line)"/>
          <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="var(--paper-line)"/>
          <path d="${pathD}" fill="none" stroke="var(--cyan)" stroke-width="2"/>
          ${dots}
          ${labels}
        </svg>
      </div>
    `;
  }

  const CHART_COLORS = ['#0071E3','#1F8A57','#D9362D','#FF9500','#6D3FE0','#0A66C2','#C2680B','#1A8A55'];

  function buildMultiQuantityChartSVG(quantityHistories){
    const series = quantityHistories.filter(qh => qh.history.length >= 2);
    if(series.length === 0) return '';
    const w = 640, h = 190, padL = 50, padR = 16, padT = 16, padB = 30;
    const dates = Array.from(new Set(series.flatMap(s=>s.history.map(h=>h.date)))).filter(Boolean).sort();
    if(dates.length < 2) return '';
    const allVals = series.flatMap(s=>s.history.map(h=>h.pa));
    const minV = Math.min(...allVals), maxV = Math.max(...allVals);
    const range = (maxV - minV) || 1;
    const x = i => padL + (i/(dates.length-1)) * (w - padL - padR);
    const y = v => padT + (1 - (v - minV)/range) * (h - padT - padB);
    let paths = '', legend = '';
    series.forEach((s, idx)=>{
      const color = CHART_COLORS[idx % CHART_COLORS.length];
      const pts = s.history.slice().reverse().filter(p=>p.date); // ordre chronologique
      const d = pts.map((p,i)=>`${i===0?'M':'L'}${x(dates.indexOf(p.date)).toFixed(1)},${y(p.pa).toFixed(1)}`).join(' ');
      const dots = pts.map(p=>`<circle cx="${x(dates.indexOf(p.date)).toFixed(1)}" cy="${y(p.pa).toFixed(1)}" r="3.5" fill="${color}"/>`).join('');
      paths += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2"/>${dots}`;
      legend += `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:16px;"><span style="width:9px;height:9px;border-radius:50%;background:${color};display:inline-block;"></span>Qté ${s.quantite}</span>`;
    });
    const labels = dates.map((d,i)=>{
      if(dates.length > 6 && i % Math.ceil(dates.length/6) !== 0 && i !== dates.length-1) return '';
      return `<text x="${x(i).toFixed(1)}" y="${h-8}" text-anchor="middle" font-family="var(--sans)" font-size="9" fill="var(--ink-soft)">${fmtDate(d).slice(0,5)}</text>`;
    }).join('');
    return `
      <div style="background:var(--card);padding:10px 0 6px;">
        <svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:640px;display:block;background:var(--card);">
          <text x="${padL-6}" y="${y(maxV).toFixed(1)}" text-anchor="end" font-family="var(--sans)" font-size="10" fill="var(--ink-soft)">${fmtE(maxV)}</text>
          <text x="${padL-6}" y="${y(minV).toFixed(1)}" text-anchor="end" font-family="var(--sans)" font-size="10" fill="var(--ink-soft)">${fmtE(minV)}</text>
          <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="var(--paper-line)"/>
          <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="var(--paper-line)"/>
          ${paths}
          ${labels}
        </svg>
        <div style="font-family:var(--sans);font-size:11px;color:var(--ink-soft);padding:6px 4px 0;">${legend}</div>
      </div>
    `;
  }

  function renderTodoView(){

    const nouveautes = todos.filter(t=>t.type==='nouveaute' && t.status==='pending');

    const aDesactiver = todos.filter(t=>t.type==='desactiver' && t.status==='pending');
    const done = todos.filter(t=>t.status==='done').sort((a,b)=>(b.doneDate||'').localeCompare(a.doneDate||''));
    const sections = [
      { key: 'nouveaute', label: 'Nouveautés produits', items: nouveautes, kind: 'pending', empty: 'Aucun nouveau fournisseur retenu en attente.' },
      { key: 'designer',  label: 'Designers à revoir', items: designers, kind: 'pending', empty: 'Aucun visuel à refaire en attente.' },
      { key: 'desactiver', label: 'Produits à désactiver', items: aDesactiver, kind: 'pending', empty: 'Aucun produit à désactiver en attente.' },
      { key: 'done',      label: 'Done', items: done, kind: 'done', empty: "Rien de terminé pour l'instant." },
    ];
    zone.innerHTML = `
      <div class="actionbar"><h2>To do list</h2></div>
      <p style="font-family:var(--sans);font-size:12px;color:var(--ink-soft);margin:-8px 0 16px;">
        Suivi des actions à faire suite à un changement de fournisseur retenu, une demande de retouche visuelle, ou un retrait du catalogue. Cliquez sur une section pour la déplier.
      </p>
      ${sections.map(s=>{
        const isOpen = expandedTodoSections.has(s.key);
        return `
        <div class="block" style="margin-bottom:10px;">
          <div class="block-head" data-action="toggle-todo-section" data-section="${s.key}" style="cursor:pointer;">
            <div style="display:flex;align-items:center;gap:8px;">
              <button class="chevron-btn" style="pointer-events:none;">${isOpen ? '▾' : '▸'}</button>
              <span class="pname">${s.label}</span>
            </div>
            <span class="supplier-count">${s.items.length} élément${s.items.length>1?'s':''}</span>
          </div>
          ${isOpen ? `
          <div class="block-body">
            ${s.items.length === 0 ? `<p class="alert-empty">${s.empty}</p>` : `
              <div class="todo-list ${s.key==='done'?'todo-list-done':''}">${s.items.map(t=>todoRowHTML(t, s.kind)).join('')}</div>
            `}
          </div>
          ` : ''}
        </div>
      `;
      }).join('')}
    `;
    zone.querySelectorAll('[data-action="toggle-todo-section"]').forEach(row=>{
      row.onclick = ()=>{
        const key = row.getAttribute('data-section');
        if(expandedTodoSections.has(key)) expandedTodoSections.delete(key);
        else expandedTodoSections.add(key);
        renderTodoView();
      };
    });
    zone.querySelectorAll('[data-action="todo-done"]').forEach(btn=>{
      btn.onclick = async (e)=>{
        e.stopPropagation();
        const id = btn.getAttribute('data-todo');
        const t = todos.find(x=>x.id===id);
        if(!t) return;
        t.status = 'done';
        t.doneDate = today();
        if(t.type === 'designer'){
          const block = (data[t.client] || []).find(b=>b.id===t.blockId);
          if(block){ block.designerARefaire = false; await saveClient(t.client); }
        }
        await saveTodos();
        logActivity(`Action terminée : ${t.produit} (${t.client})`);
        renderTodoView();
      };
    });
    zone.querySelectorAll('[data-action="todo-restore"]').forEach(btn=>{
      btn.onclick = async (e)=>{
        e.stopPropagation();
        const id = btn.getAttribute('data-todo');
        const t = todos.find(x=>x.id===id);
        if(!t) return;
        t.status = 'pending';
        delete t.doneDate;
        if(t.type === 'designer'){
          const block = (data[t.client] || []).find(b=>b.id===t.blockId);
          if(block){ block.designerARefaire = true; await saveClient(t.client); }
        }
        await saveTodos();
        renderTodoView();
      };
    });
  }

  function renderSidebarClients(){
    const zone = document.getElementById('sidebarClients');
    zone.innerHTML = '';
    clients.filter(c=>!archivedClients.includes(c)).forEach(c=>{
      if(renamingClient === c){
        const wrap = document.createElement('div');
        wrap.innerHTML = `
          <input type="text" id="renameInput" class="sidebar-rename-input" value="${escapeHtml(c)}">
          <div class="sidebar-rename-actions">
            <button id="renameOk">Enregistrer</button>
            <button id="renameCancel">Annuler</button>
          </div>`;
        zone.appendChild(wrap);
        const input = wrap.querySelector('#renameInput');
        input.focus();
        input.select();
        const commit = async ()=>{
          const newName = input.value.trim();
          if(!newName){ showBanner('Le nom du client ne peut pas être vide.'); return; }
          if(newName !== c && clients.includes(newName)){ showBanner('Un autre client porte déjà ce nom.'); return; }
          if(newName === c){ renamingClient = null; renderSidebarClients(); return; }
          await renameClientTo(c, newName);
          renamingClient = null;
          renderAll();
        };
        input.addEventListener('keydown', e=>{
          if(e.key==='Enter') commit();
          if(e.key==='Escape'){ renamingClient = null; renderSidebarClients(); }
        });
        wrap.querySelector('#renameOk').onclick = commit;
        wrap.querySelector('#renameCancel').onclick = ()=>{ renamingClient = null; renderSidebarClients(); };
        return;
      }
      const row = document.createElement('div');
      row.className = 'sidebar-client-row' + (currentView==='client' && c===currentClient ? ' active':'');
      const nb = (data[c] || []).length;
      row.innerHTML = `
        <button class="sidebar-client-btn">${escapeHtml(c)}<span class="sidebar-client-count">${nb}</span></button>
        <button class="sidebar-client-edit" title="Renommer ce client">${ICONS.pencil}</button>
        <button class="sidebar-client-edit" data-clientarchive="${escapeHtml(c)}" title="Archiver ce client">📦</button>
        <button class="sidebar-client-edit" data-clientdelete="${escapeHtml(c)}" title="Supprimer ce client" style="color:var(--bad);">🗑</button>
      `;
      row.querySelector('.sidebar-client-btn').onclick = ()=>{
        currentClient = c; currentView='client'; showForm=false; showAddClient=false; editingOffer=null;
        categoryFilter='Toutes'; supplierFilter='Tous'; searchQuery=''; visibleCount=PAGE_SIZE; selectedBlocks.clear();
        rememberLastClient(c);
        renderAll();
      };
      row.querySelector('.sidebar-client-edit').onclick = (e)=>{
        e.stopPropagation();
        renamingClient = c;
        renderSidebarClients();
      };
      row.querySelector('[data-clientarchive]').onclick = (e)=>{
        e.stopPropagation();
        openArchiveClientModal(c);
      };
      row.querySelector('[data-clientdelete]').onclick = (e)=>{
        e.stopPropagation();
        openDeleteClientModal(c);
      };
      zone.appendChild(row);
    });

    if(archivedClients.length > 0){
      const link = document.createElement('button');
      link.className = 'sidebar-archived-link';
      link.textContent = `📦 ${archivedClients.length} client(s) archivé(s)`;
      link.onclick = openArchivedClientsModal;
      zone.appendChild(link);
    }

    if(showAddClient){
      const wrap = document.createElement('div');
      wrap.innerHTML = `
        <input type="text" id="newClientName" class="sidebar-rename-input" placeholder="Nom du client">
        <div class="sidebar-rename-actions">
          <button id="newClientOk">Ajouter</button>
          <button id="newClientCancel">Annuler</button>
        </div>`;
      zone.appendChild(wrap);
      const input = wrap.querySelector('#newClientName');
      input.focus();
      const commit = async ()=>{
        const name = input.value.trim();
        if(!name){ showBanner('Merci de saisir un nom de client.'); return; }
        if(clients.includes(name)){ showBanner('Ce client existe déjà.'); return; }
        clients.push(name);
        data[name] = [];
        await saveClientsList();
        await saveClient(name);
        currentClient = name;
        currentView = 'client';
        showAddClient = false;
        logActivity(`Client créé : ${name}`);
        renderAll();
      };
      wrap.querySelector('#newClientOk').onclick = commit;
      input.addEventListener('keydown', e=>{ if(e.key==='Enter') commit(); if(e.key==='Escape'){ showAddClient=false; renderAll(); } });
      wrap.querySelector('#newClientCancel').onclick = ()=>{ showAddClient=false; renderAll(); };
    } else {
      const add = document.createElement('button');
      add.className = 'sidebar-add-client';
      add.innerHTML = `${ICONS.add}<span>Nouveau client</span>`;
      add.onclick = ()=>{ showAddClient = true; renderSidebarClients(); document.getElementById('newClientName').focus(); };
      zone.appendChild(add);
    }
  }

  function updateSupplierDatalist(){
    const dl = document.getElementById('supplierDatalist');
    const dlTech = document.getElementById('techniqueDatalist');
    const dlFin = document.getElementById('finitionsDatalist');
    if(!dl) return;
    const names = new Set(), techniques = new Set(), finitions = new Set();
    clients.forEach(c=>{
      (data[c] || []).forEach(b=>{
        if(b.catalogue.fournisseur) names.add(b.catalogue.fournisseur);
        b.offres.forEach(o=>{ if(o.fournisseur) names.add(o.fournisseur); });
        if(b.technique) techniques.add(b.technique);
        if(b.finitions) finitions.add(b.finitions);
      });
    });
    dl.innerHTML = Array.from(names).sort((a,b)=>a.localeCompare(b,'fr')).map(n=>`<option value="${escapeHtml(n)}">`).join('');
    if(dlTech) dlTech.innerHTML = Array.from(techniques).sort((a,b)=>a.localeCompare(b,'fr')).map(n=>`<option value="${escapeHtml(n)}">`).join('');
    if(dlFin) dlFin.innerHTML = Array.from(finitions).sort((a,b)=>a.localeCompare(b,'fr')).map(n=>`<option value="${escapeHtml(n)}">`).join('');
  }

  function renderStats(){
    const allClientBlocks = data[currentClient] || [];
    const modeOf = (b)=> b.nouveaute ? 'nouveautes' : (b.stocke ? 'stocke' : 'actif');
    const blocks = allClientBlocks.filter(b=> modeOf(b) === catalogueMode);
    const nbProduits = blocks.length;
    const nbAnalyses = blocks.reduce((s,b)=>s+b.offres.length,0);
    const nbValide = blocks.filter(b=>b.offres.some(o=>o.retenu)).length;
    const taux = blocks.map(b=>{ const c = computeBlock(b); return c.pv ? (c.marge / c.pv) * 100 : null; }).filter(v=>v !== null);
    const tauxMoyen = taux.length ? taux.reduce((s,v)=>s+v,0) / taux.length : null;
    const stats = document.getElementById('stats');
    stats.innerHTML = `
      <div class="stat"><div class="num">${nbProduits}</div><div class="lbl">Produits suivis</div></div>
      <div class="stat"><div class="num">${nbAnalyses}</div><div class="lbl">Offres comparées</div></div>
      <div class="stat"><div class="num">${nbValide}</div><div class="lbl">Fournisseurs validés</div></div>
      <div class="stat"><div class="num">${tauxMoyen===null ? '—' : (Math.round(tauxMoyen*10)/10).toLocaleString('fr-FR') + ' %'}</div><div class="lbl">Taux de marge moyen</div></div>
    `;
    document.getElementById('clientTitle').textContent = currentClient || 'Aucun client actif';

    const nbActif = allClientBlocks.filter(b=>modeOf(b)==='actif').length;
    const nbNouveautes = allClientBlocks.filter(b=>modeOf(b)==='nouveautes').length;
    const nbStocke = allClientBlocks.filter(b=>modeOf(b)==='stocke').length;
    const toggleZone = document.getElementById('catalogueModeToggle');
    if(toggleZone){
      toggleZone.innerHTML = `
        <div class="catmode-toggle">
          <button class="catmode-btn ${catalogueMode==='actif'?'active':''}" data-catmode="actif">Catalogue actif <span class="catmode-count">${nbActif}</span></button>
          <button class="catmode-btn ${catalogueMode==='nouveautes'?'active':''}" data-catmode="nouveautes">🆕 Nouveautés <span class="catmode-count">${nbNouveautes}</span></button>
          <button class="catmode-btn ${catalogueMode==='stocke'?'active':''}" data-catmode="stocke">📦 Produits stockés <span class="catmode-count">${nbStocke}</span></button>
        </div>
      `;
      toggleZone.querySelectorAll('[data-catmode]').forEach(btn=>{
        btn.onclick = ()=>{
          catalogueMode = btn.getAttribute('data-catmode');
          expandedBlocks.clear();
          selectedBlocks.clear();
          renderAll();
        };
      });
    }
  }

  function syncPriceRowsFromDOM(){
    // relit les valeurs actuellement tapées dans le tableau (avant d'ajouter/retirer une ligne ou d'enregistrer)
    const body = document.getElementById('priceRowsBody');
    if(!body) return;
    body.querySelectorAll('tr').forEach(tr=>{
      const id = tr.getAttribute('data-rowid');
      const row = formPriceRows.find(r=>r.id===id);
      if(!row) return;
      row.quantite = parseNum(tr.querySelector('.pt-qty').value) || 0;
      row.pa = parseNum(tr.querySelector('.pt-pa').value);
      row.frais = parseNum(tr.querySelector('.pt-frais').value);
      const fraisTechEl = tr.querySelector('.pt-fraistech');
      if(fraisTechEl) row.fraisTechnique = parseNum(fraisTechEl.value) || 0;
      row.pv = parseNum(tr.querySelector('.pt-pv').value);
    });
  }

  function renderPriceRowsTable(){
    const container = document.getElementById('priceRowsContainer');
    if(!container) return;
    container.innerHTML = priceRowsTableHTML();
    attachPriceRowsHandlers();
  }

  function attachPriceRowsHandlers(){
    const addBtn = document.getElementById('addPriceRow');
    if(addBtn){
      addBtn.onclick = ()=>{
        syncPriceRowsFromDOM();
        const lastPv = formPriceRows.length ? formPriceRows[formPriceRows.length-1].pv : '';
        formPriceRows.push({id: uid(), quantite: '', pa: '', frais: 0, pv: lastPv});
        renderPriceRowsTable();
      };
    }
    document.querySelectorAll('.pt-remove').forEach(btn=>{
      btn.onclick = ()=>{
        syncPriceRowsFromDOM();
        const id = btn.getAttribute('data-rowid');
        formPriceRows = formPriceRows.filter(r=>r.id!==id);
        renderPriceRowsTable();
      };
    });
  }

              <td><input type="number" step="0.01" class="opt-pa" value="${r.pa}" style="min-width:60px;"></td>
              <td><input type="number" step="0.01" class="opt-frais" value="${r.frais}" style="min-width:60px;"></td>
              ${isTextile ? `<td><input type="number" step="0.01" class="opt-fraistech" value="${r.fraisTechnique !== undefined ? r.fraisTechnique : ''}" style="min-width:60px;"></td>` : ''}
              <td><button type="button" class="opt-remove" data-rowid="${r.id}" ${offerPriceRows.length<=1?'disabled':''}>✕</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <button type="button" class="link" id="addOfferPriceRow" style="font-size:11px;">+ Ajouter une quantité</button>
    `;
  }

  function syncOfferPriceRowsFromDOM(){
    const body = document.getElementById('offerPriceRowsBody');
    if(!body) return;
    body.querySelectorAll('tr').forEach(tr=>{
      const id = tr.getAttribute('data-rowid');
      const row = offerPriceRows.find(r=>r.id===id);
      if(!row) return;
      row.quantite = parseNum(tr.querySelector('.opt-qty').value) || 0;
      row.pa = parseNum(tr.querySelector('.opt-pa').value);
      row.frais = parseNum(tr.querySelector('.opt-frais').value);
      const fraisTechEl = tr.querySelector('.opt-fraistech');
      if(fraisTechEl) row.fraisTechnique = parseNum(fraisTechEl.value) || 0;
    });
  }

  function renderOfferPriceRowsTable(){
    const container = document.getElementById('offerPriceRowsContainer');
    if(!container) return;
    container.innerHTML = offerPriceRowsTableHTML();
    attachOfferPriceRowsHandlers();
  }

  function attachOfferPriceRowsHandlers(){
    const addBtn = document.getElementById('addOfferPriceRow');
    if(addBtn){
      addBtn.onclick = ()=>{
        syncOfferPriceRowsFromDOM();
        offerPriceRows.push({id: uid(), quantite: '', pa: '', frais: 0});
        renderOfferPriceRowsTable();
      };
    }
    document.querySelectorAll('.opt-remove').forEach(btn=>{
      btn.onclick = ()=>{
        syncOfferPriceRowsFromDOM();
        const id = btn.getAttribute('data-rowid');
        offerPriceRows = offerPriceRows.filter(r=>r.id!==id);
        renderOfferPriceRowsTable();
      };
    });
  }

          quantite: refRow.quantite,
        };
        const historique = editing ? (editing.catalogue.historique || []) : [];
        if(editing){
          const oldCat = editing.catalogue;

          if(aChange){
            historique.push({date: oldCat.date, fournisseur: oldCat.fournisseur, pa: oldCat.pa, pv: oldCat.pv});

        }
        const oldPrixById = editing ? Object.fromEntries((editing.catalogue.prix||[]).map(r=>[r.id, r])) : {};

          const oldRow = oldPrixById[r.id];
          const rowHistorique = oldRow && oldRow.historique ? oldRow.historique.slice() : [];

            rowHistorique.push({date: oldRow.dateMaj || (editing ? editing.catalogue.date : today()), pa: oldRow.pa});
          }
          return {id: r.id, quantite: r.quantite, pa: r.pa, frais: r.frais||0, fraisTechnique: r.fraisTechnique||0, pv: r.pv, historique: rowHistorique, dateMaj: dateValidite};
        });
        const catalogue = {
          fournisseur: fournisseurSaisi,

  function csvEscape(v){

  function buildExportCSV(selectedClients){
    const headers = ["Client","Catégorie","Produit","Référence","Technique de marquage","Finitions",
      "Quantité","Fournisseur retenu","PA retenu (€)","PV (€)","Frais de port (€)","Coefficient de marge",
      "Marge unitaire (€)","Marge totale (€)","Statut","Date MAJ catalogue","Lien produit"];
    const rows = [headers];
    selectedClients.forEach(client=>{
      (data[client] || []).forEach(b=>{
        const c = computeBlock(b);
        const retained = b.offres.find(o=>o.retenu);
        const lien = retained ? (retained.lien || '') : (b.catalogue.lien || '');
        const statut = b.offres.some(o=>o.retenu) ? 'Validé' : 'A valider';
        rows.push([
          client, b.categorie, b.produit, b.catalogue.reference || '', b.technique, b.finitions,
          b.quantite, c.fournRetenu, fmtNum(c.paRetenu), fmtNum(c.pv), fmtNum(c.fraisRetenu),
          fmtNum(c.coeff) + 'x', fmtNum(c.marge), fmtNum(c.margeTotale), statut, fmtDate(b.catalogue.date), lien
        ]);
      });
    });
    return rows.map(r=>r.map(csvEscape).join(';')).join('\r\n');
  }

  function tryDownload(content, filename, mime){
    mime = mime || 'text/csv;charset=utf-8;';
    try{
      const bom = mime.indexOf('csv') > -1 ? '\ufeff' : '';
      const blob = new Blob([bom + content], {type: mime});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      return true;
    }catch(err){
      console.error('download failed', err);
      return false;
    }
  }

  function buildProductBlockAOA(block){
    const sources = [
      { label: `${block.catalogue.fournisseur} (catalogue)`, reference: block.catalogue.reference, prix: block.catalogue.prix || [] },
      ...block.offres.map(o=>({ label: o.fournisseur, reference: o.reference, prix: o.prix || [] }))
    ];
    const qtySet = new Set();
    sources.forEach(s=>s.prix.forEach(p=>qtySet.add(p.quantite)));
    const quantites = Array.from(qtySet).sort((a,b2)=>a-b2);
    const pvAtQty = (qty)=>{
      const row = (block.catalogue.prix||[]).find(p=>p.quantite===qty);
      return (row && row.pv !== undefined && row.pv !== null && row.pv !== '') ? row.pv : (block.catalogue.pv || 0);
    };
    const isPrint = block.categorie === 'Print';
    const isTextile = block.categorie === 'Textile';
    const round2 = n => Math.round(n*100)/100;
    const calc = (row, qty, pv)=>{
      if(!row) return null;
      const fraisTech = row.fraisTechnique||0;
      const fraisUnit = isPrint ? (row.frais||0) : (qty ? (row.frais||0)/qty : 0);
      const fraisTechUnit = (isTextile && qty) ? fraisTech/qty : 0;
      const totalHT = isPrint ? (row.pa + (row.frais||0)) : (row.pa*qty + (row.frais||0) + (isTextile ? fraisTech : 0));
      const coutUnit = row.pa + fraisUnit + fraisTechUnit;
      const margeGlobale = isPrint ? (pv-coutUnit) : (pv-coutUnit)*qty;
      const coef = coutUnit ? pv/coutUnit : 0;
      const vals = [round2(row.pa), round2(row.frais||0)];
      if(isTextile) vals.push(round2(fraisTech));
      vals.push(round2(totalHT), round2(pv), round2(margeGlobale), round2(coef));
      return vals;
    };
    const SUBCOLS = isTextile
      ? ['PA','Frais de port','Frais technique','Total HT','PV','Marge globale','Coef. marge']
      : ['PA','Frais de port','Total HT','PV','Marge globale','Coef. marge'];
    const nbSub = SUBCOLS.length;
    const emptyRow = new Array(nbSub).fill('—');

    const aoa = [];
    aoa.push([`${block.produit}${block.finitions ? ' - ' + block.finitions : ''}`]);
    aoa.push([]);
    const headerRow1 = [''];
    sources.forEach(s=>{ headerRow1.push(s.label); for(let i=1;i<nbSub;i++) headerRow1.push(''); });
    aoa.push(headerRow1);
    const headerRow2 = [''];
    sources.forEach(s=>{ headerRow2.push(s.reference || '—'); for(let i=1;i<nbSub;i++) headerRow2.push(''); });
    aoa.push(headerRow2);
    const headerRow3 = ['Quantité'];
    sources.forEach(()=>{ SUBCOLS.forEach(c=>headerRow3.push(c)); });
    aoa.push(headerRow3);
    quantites.forEach(q=>{
      const pv = pvAtQty(q);
      const row = [q];
      sources.forEach(s=>{
        const r = s.prix.find(p=>p.quantite===q);
        const vals = calc(r, q, pv);
        if(vals) row.push(...vals); else row.push(...emptyRow);
      });
      aoa.push(row);
    });
    aoa.push([]); // ligne de séparation avant le produit suivant

    // fusions relatives au début de ce bloc (r=0 correspond à la 1ère ligne de ce produit)
    const merges = [{ s:{r:0,c:0}, e:{r:0,c:sources.length*nbSub} }];
    sources.forEach((s,i)=>{
      const startCol = 1 + i*nbSub;
      merges.push({ s:{r:2,c:startCol}, e:{r:2,c:startCol+nbSub-1} });
      merges.push({ s:{r:3,c:startCol}, e:{r:3,c:startCol+nbSub-1} });
    });
    return { aoa, merges, nbCols: 1 + sources.length*nbSub };
  }

  function buildCategorySheet(blocks){
    const combinedAoa = [];
    const combinedMerges = [];
    let maxCols = 1;
    blocks.forEach(block=>{
      const { aoa, merges, nbCols } = buildProductBlockAOA(block);
      const rowOffset = combinedAoa.length;
      merges.forEach(m=>{
        combinedMerges.push({ s:{r:m.s.r+rowOffset, c:m.s.c}, e:{r:m.e.r+rowOffset, c:m.e.c} });
      });
      combinedAoa.push(...aoa);
      if(nbCols > maxCols) maxCols = nbCols;
    });
    const ws = XLSX.utils.aoa_to_sheet(combinedAoa);
    ws['!merges'] = combinedMerges;
    ws['!cols'] = Array.from({length: maxCols}, (_,i)=> i===0 ? {wch:10} : {wch:13});
    return ws;
  }

  function uniqueSheetName(wb, baseName){
    let name = baseName.replace(/[\\\/\?\*\[\]:]/g, ' ').trim().slice(0, 31) || 'Produit';
    let final = name, i = 2;
    while(wb.SheetNames.includes(final)){
      const suffix = ` (${i})`;
      final = name.slice(0, 31 - suffix.length) + suffix;
      i++;
    }
    return final;
  }

  function readJSONFile(){
    return new Promise((resolve, reject)=>{
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.onchange = ()=>{
        const file = input.files && input.files[0];
        if(!file){ reject(new Error('Aucun fichier sélectionné.')); return; }
        const reader = new FileReader();
        reader.onload = ()=>{
          try{ resolve({name: file.name, parsed: JSON.parse(reader.result)}); }
          catch(e){ reject(new Error(`« ${file.name} » n'est pas un JSON valide.`)); }
        };
        reader.onerror = ()=>reject(new Error(`Impossible de lire « ${file.name} ».`));
        reader.readAsText(file);
      };
      input.click();
    });
  }

  function diffBackups(oldB, newB){
    const clientsSet = new Set([...(oldB.clients||[]), ...(newB.clients||[])]);
    const report = [];
    clientsSet.forEach(client=>{
      const oldBlocks = (oldB.data && oldB.data[client]) || [];
      const newBlocks = (newB.data && newB.data[client]) || [];
      const oldById = Object.fromEntries(oldBlocks.map(b=>[b.id,b]));
      const newById = Object.fromEntries(newBlocks.map(b=>[b.id,b]));
      const added = newBlocks.filter(b=>!oldById[b.id]);
      const removed = oldBlocks.filter(b=>!newById[b.id]);
      const changed = [];
      newBlocks.forEach(nb=>{
        const ob = oldById[nb.id];
        if(!ob) return;
        const oc = ob.catalogue, nc = nb.catalogue;
        if(oc.pa !== nc.pa || oc.pv !== nc.pv || oc.fournisseur !== nc.fournisseur){
          changed.push({produit: nb.produit, old: oc, new: nc});
        }
      });
      if(added.length || removed.length || changed.length){
        report.push({client, added, removed, changed});
      }
    });
    return report;
  }

  function openImportCSVModal(){
    const modal = document.getElementById('exportModal');
    modal.innerHTML = `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
          <div class="modal-head"><h3>Importer des produits — ${escapeHtml(currentClient)}</h3><button class="ghost" id="modalClose">Fermer ✕</button></div>
          <div class="modal-body">
            <p>Collez vos lignes ci-dessous, séparées par des points-virgules ou des tabulations (copié depuis Excel), dans cet ordre : <b>Catégorie;Produit;Référence;Technique;Finitions;Quantité;Fournisseur;PA;PV;Frais de port;Frais technique</b>. Une ligne d'en-tête est acceptée et ignorée automatiquement. Seuls Produit, PA et PV sont obligatoires. La colonne Frais technique n'est utile que pour la catégorie Textile — laissez-la vide sinon.</p>
            <p class="form-hint">Astuce : pour comparer plusieurs quantités d'un même produit, répétez plusieurs lignes avec le même nom de produit <b>et</b> la même finition, en ne changeant que la quantité — elles seront regroupées automatiquement dans le même tableau de prix. À l'inverse, si la finition diffère pour un nom de produit identique (ex. Flyer A5 en pelliculage mat vs brillant), l'outil crée deux produits distincts, car la finition influence le prix.</p>
            <textarea id="csvImportText" placeholder="Goodies;Mug céramique;REF-01;Sérigraphie;Sans;500;Fournisseur X;1,20;3,50;20
Textile;Tee-shirt floqué;TS-01;Flocage;Coton bio;100;Fournisseur Y;4,00;12,00;15;50" style="height:200px;"></textarea>
          </div>
          <div class="modal-actions">
            <button class="primary" id="doImportCSV">Importer</button>
            <button class="ghost" id="modalCancel">Annuler</button>
            <span class="modal-status" id="modalStatus"></span>
          </div>
        </div>
      </div>
    `;
    const close = ()=>{ modal.innerHTML=''; };
    document.getElementById('modalClose').onclick = close;
    document.getElementById('modalCancel').onclick = close;
    document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') close(); });
    document.getElementById('doImportCSV').onclick = async ()=>{
      const raw = document.getElementById('csvImportText').value;
      const lines = raw.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
      let imported = 0, addedQty = 0, skipped = 0;
      // index des produits déjà présents chez ce client (existants + ceux créés pendant cet import), par nom normalisé
      const byName = {};
      (data[currentClient] || []).filter(b=>(b.nouveaute?'nouveautes':(b.stocke?'stocke':'actif')) === catalogueMode).forEach(b=>{ byName[b.produit.trim().toLowerCase() + '|' + (b.finitions||'').trim().toLowerCase()] = b; });
      for(const line of lines){
        const sep = line.indexOf('\t') > -1 ? '\t' : ';';
        const cols = line.split(sep).map(c=>c.trim());
        if(cols[0] && cols[0].toLowerCase().includes('catégorie') && cols[1] && cols[1].toLowerCase().includes('produit')){
          continue; // ligne d'en-tête
        }
        const [categorieRaw, produit, reference, technique, finitions, quantiteRaw, fournisseur, paRaw, pvRaw, fraisRaw, fraisTechRaw] = cols;
        const categorie = CATS.includes(categorieRaw) ? categorieRaw : CATS[0];
        const pa = parseNum(paRaw);
        const pv = parseNum(pvRaw);
        if(!produit || isNaN(pa) || isNaN(pv)){ skipped++; continue; }
        const frais = parseNum(fraisRaw);
        const fraisTech = parseNum(fraisTechRaw);
        const qte = parseNum(quantiteRaw) || 0;
        const key = produit.trim().toLowerCase() + '|' + (finitions||'').trim().toLowerCase();
        const existing = byName[key];
        if(existing){
          // même produit déjà importé (ou déjà présent) : on ajoute/actualise juste la ligne de quantité
          if(!existing.catalogue.prix) existing.catalogue.prix = [];
          let row = existing.catalogue.prix.find(p=>p.quantite===qte);
          if(row){
            if(row.pa !== pa){ if(!row.historique) row.historique = []; row.historique.push({date: row.dateMaj || existing.catalogue.date, pa: row.pa}); row.dateMaj = today(); }
            row.pa = pa; row.frais = isNaN(frais)?0:frais; row.fraisTechnique = isNaN(fraisTech)?0:fraisTech;
          } else {
            existing.catalogue.prix.push({id: uid(), quantite: qte, pa, frais: isNaN(frais)?0:frais, fraisTechnique: isNaN(fraisTech)?0:fraisTech, historique: []});
          }
          if(qte === existing.quantite){ existing.catalogue.pa = pa; existing.catalogue.frais = isNaN(frais)?0:frais; }
          addedQty++;
        } else {
          const newBlock = {
            id: uid(), categorie, produit, reference: reference||'', technique: technique||'', finitions: finitions||'',
            quantite: qte, tags: [], nouveaute: catalogueMode === 'nouveautes', stocke: catalogueMode === 'stocke',
            catalogue: { fournisseur: fournisseur || '—', reference: reference||'', lien:'', devis:null, devisValidite:'',
                         pa, pv, frais: isNaN(frais)?0:frais, date: today(), historique: [],
                         prix: [{id: uid(), quantite: qte, pa, frais: isNaN(frais)?0:frais, fraisTechnique: isNaN(fraisTech)?0:fraisTech, historique: []}] },
            offres: []
          };
          data[currentClient].push(newBlock);
          byName[key] = newBlock;
          imported++;
        }
      }
      if(imported>0 || addedQty>0) await saveClient(currentClient);
      const status = document.getElementById('modalStatus');
      const parts = [];
      if(imported>0) parts.push(`${imported} produit(s) créé(s)`);
      if(addedQty>0) parts.push(`${addedQty} ligne(s) de quantité ajoutée(s)/mise(s) à jour`);
      if(skipped>0) parts.push(`${skipped} ligne(s) ignorée(s) (format invalide)`);
      status.textContent = parts.length ? parts.join(', ') + '.' : 'Aucune ligne valide trouvée.';
      status.style.color = (imported>0 || addedQty>0) ? 'var(--good)' : 'var(--bad)';
      if(imported>0 || addedQty>0) renderAll();
    };
  }


  let supplierFilter = 'Tous';

  function blockSupplier(b){
    const retained = b.offres.find(o=>o.retenu);
    return retained ? retained.fournisseur : b.catalogue.fournisseur;
  }

  function matchesFilter(b){
    const bMode = b.nouveaute ? 'nouveautes' : (b.stocke ? 'stocke' : 'actif');
    if(catalogueMode !== bMode) return false;
    if(categoryFilter !== 'Toutes' && b.categorie !== categoryFilter) return false;
    if(supplierFilter !== 'Tous' && blockSupplier(b) !== supplierFilter) return false;
    if(searchQuery.trim()){
      const q = searchQuery.trim().toLowerCase();
      const haystack = [
        b.produit, b.technique, b.finitions,
        b.catalogue.reference || '', b.catalogue.fournisseur || '',
        ...b.offres.map(o => `${o.fournisseur} ${o.reference||''}`)
      ].join(' ').toLowerCase();
      if(!haystack.includes(q)) return false;
    }
    return true;
  }

  function debounce(fn, delay){
    let t;
    return (...args)=>{ clearTimeout(t); t = setTimeout(()=>fn(...args), delay); };
  }

  function renderFilters(){
    const zone = document.getElementById('filters');
    const blocks = data[currentClient] || [];
    const total = blocks.length;
    const shown = blocks.filter(matchesFilter).length;
    const cats = ['Toutes', ...CATS];
    const suppliers = Array.from(new Set(blocks.map(blockSupplier).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'fr'));
    zone.innerHTML = `
      <div class="filterbar">
        <div class="catpills">
          ${cats.map(c => `<button class="catpill ${categoryFilter===c?'active':''}" data-cat="${c}">${c}</button>`).join('')}
        </div>
        <select id="supplierFilterSelect" class="supplier-select">
          <option value="Tous">Tous les fournisseurs</option>
          ${suppliers.map(s=>`<option value="${escapeHtml(s)}" ${supplierFilter===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}
        </select>
        <div class="searchbox">
          <span class="icon">⌕</span>
          <input type="text" id="searchInput" placeholder="Rechercher un produit, une référence, un fournisseur..." value="${searchQuery.replace(/"/g,'&quot;')}">
        </div>
        ${(categoryFilter !== 'Toutes' || supplierFilter !== 'Tous' || searchQuery.trim()) ? `<span class="filter-count">${shown} / ${total} produit(s)</span>` : ''}
        <span style="margin-left:auto;display:flex;gap:12px;">
          <button class="link" id="expandAllBtn" style="font-size:11.5px;">Tout déplier</button>
          <button class="link" id="collapseAllBtn" style="font-size:11.5px;">Tout replier</button>
        </span>
      </div>
    `;
    zone.querySelectorAll('.catpill').forEach(btn=>{
      btn.onclick = ()=>{ categoryFilter = btn.getAttribute('data-cat'); visibleCount=PAGE_SIZE; renderFilters(); renderBlocks(); };
    });
    document.getElementById('supplierFilterSelect').onchange = (e)=>{
      supplierFilter = e.target.value; visibleCount=PAGE_SIZE; renderBlocks(); updateFilterCount();
    };
    const input = document.getElementById('searchInput');
    const debouncedFilter = debounce(()=>{ visibleCount=PAGE_SIZE; renderBlocks(); updateFilterCount(); }, 200);
    input.oninput = ()=>{ searchQuery = input.value; debouncedFilter(); };
    document.getElementById('expandAllBtn').onclick = ()=>{
      (data[currentClient] || []).forEach(b=>expandedBlocks.add(b.id));
      renderBlocks();
    };
    document.getElementById('collapseAllBtn').onclick = ()=>{
      (data[currentClient] || []).forEach(b=>expandedBlocks.delete(b.id));
      renderBlocks();
    };
  }

  function updateFilterCount(){
    // met à jour uniquement le compteur, sans reconstruire la barre (pour ne pas perdre le focus du champ de recherche)
    const blocks = data[currentClient] || [];
    const total = blocks.length;
    const shown = blocks.filter(matchesFilter).length;
    const bar = document.querySelector('.filterbar');
    if(!bar) return;
    let countEl = bar.querySelector('.filter-count');
    if(categoryFilter !== 'Toutes' || searchQuery.trim()){
      if(!countEl){
        countEl = document.createElement('span');
        countEl.className = 'filter-count';
        bar.appendChild(countEl);
      }
      countEl.textContent = `${shown} / ${total} produit(s)`;
    } else if(countEl){
      countEl.remove();
    }
  }


  const PAGE_SIZE = 30;
  let visibleCount = PAGE_SIZE;
  let selectedBlocks = new Set();

  // ---- Annuler la dernière suppression (Ctrl+Z ou bannière "Annuler") ----
  let undoStack = []; // {label, clientName, snapshot} — snapshot = copie complète des produits du client avant l'action
  const UNDO_STACK_MAX = 10;
  function pushUndo(label, clientName){
    undoStack.push({ label, clientName, snapshot: JSON.parse(JSON.stringify(data[clientName] || [])) });
    if(undoStack.length > UNDO_STACK_MAX) undoStack.shift();
  }
  async function undoLast(){
    const entry = undoStack.pop();
    if(!entry){ showBanner('Rien à annuler.', 'info'); return; }
    data[entry.clientName] = entry.snapshot;
    await saveClient(entry.clientName);
    if(entry.clientName === currentClient) { /* déjà sur le bon client */ }
    else { currentClient = entry.clientName; currentView = 'client'; }
    logActivity(`Annulation : ${entry.label} (${entry.clientName})`);
    showBanner(`Annulé : ${entry.label}`, 'info');
    renderAll();
  }

  function renderBlocks(){
    const holder = document.getElementById('blocks');
    const allBlocks = data[currentClient] || [];
    const blocks = allBlocks.filter(matchesFilter).sort((a,b)=> (a.archived?1:0) - (b.archived?1:0));
    if(blocks.length === 0){
      if(allBlocks.length === 0){
        holder.innerHTML = `<div class="empty">Aucun produit pour ce client pour l'instant.<br>Cliquez sur « + Ajouter un produit » pour commencer.</div>`;
      } else {
        holder.innerHTML = `<div class="empty">Aucun produit ne correspond à ce filtre ou cette recherche.</div>`;
      }
      return;
    }
    holder.innerHTML = '';

    if(selectedBlocks.size > 0){
      const bar = document.createElement('div');
      bar.className = 'bulk-toolbar';
      bar.innerHTML = `
        <span>${selectedBlocks.size} produit(s) sélectionné(s)</span>
        <button class="ghost" id="bulkClear">Désélectionner</button>

        <button class="ghost" id="bulkDelete" style="border-color:var(--bad);color:var(--bad);">Supprimer la sélection</button>
      `;
      holder.appendChild(bar);
      bar.querySelector('#bulkClear').onclick = ()=>{ selectedBlocks.clear(); renderBlocks(); };
      bar.querySelector('#bulkExportExcel').onclick = exportSelectionExcel;
      bar.querySelector('#bulkDelete').onclick = async ()=>{
        const n = selectedBlocks.size;
        pushUndo(`suppression groupée de ${n} produit(s)`, currentClient);
        data[currentClient] = allBlocks.filter(b=>!selectedBlocks.has(b.id));
        selectedBlocks.clear();
        await saveClient(currentClient);
        logActivity(`${n} produit(s) supprimé(s) en groupe (${currentClient})`);
        showBanner(`${n} produit(s) supprimé(s) · <a href="#" id="undoLink" style="color:inherit;font-weight:700;">Annuler</a>`, 'info');
        renderAll();
        const undoLink = document.getElementById('undoLink');
        if(undoLink) undoLink.onclick = (e)=>{ e.preventDefault(); undoLast(); };
      };

    const visibleBlocks = blocks.slice(0, visibleCount);
    visibleBlocks.forEach(b=>{
      const c = computeBlock(b);
      const div = document.createElement('div');
      const taux = c.pv ? (c.marge / c.pv) * 100 : null;

      div.className = 'block' + (belowSeuil ? ' block-warning' : '') + (b.archived ? ' block-archived' : '');
      div.setAttribute('data-block-id', b.id);
      const hasRetenu = b.offres.some(o=>o.retenu);

        <div class="block-head">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">

            <button class="chevron-btn" data-action="toggle-bloc" data-block="${b.id}" title="${isExpanded ? 'Replier' : 'Déplier'}">${isExpanded ? '▾' : '▸'}</button>
            <span class="tag" style="${catColorStyle(b.categorie)}">${b.categorie}</span>
            <span class="pname">${b.produit}</span>
            ${b.technique ? `<span class="ptechnique">${escapeHtml(b.technique)}</span>` : ''}
            <label class="designer-check" title="Cocher si le visuel doit être refait">
              <input type="checkbox" data-action="toggle-designer" data-block="${b.id}" ${b.designerARefaire ? 'checked' : ''}>
              Designer à refaire
            </label>
            ${tags.map(t=>`<span class="tag-chip">${escapeHtml(t)}${isExpanded ? `<button data-action="suppr-tag" data-block="${b.id}" data-tag="${escapeHtml(t)}">×</button>` : ''}</span>`).join('')}
            ${b.archived ? `<span class="badge-pending" style="background:var(--bad);color:#fff;">Retiré du catalogue</span>` : ''}
            ${!b.archived && belowSeuil ? `<span class="badge-pending" style="background:var(--bad-soft);color:var(--bad);">⚠ sous le seuil (${seuil}%)</span>` : ''}
            ${!b.archived && isStale ? `<span class="badge-pending" style="background:var(--bad-soft);color:var(--bad);">⏱ maj il y a ${staleM} mois</span>` : ''}
          </div>
          <div class="sub">
            ${!isExpanded ? `${nbOffres} offre${nbOffres>1?'s':''} comparée${nbOffres>1?'s':''}${!hasRetenu && nbOffres>0 ? ' · <span class="badge-pending" style="margin-left:2px;">à valider</span>' : ''}` : `${b.finitions || '—'}`}
            · <button class="link" data-action="modifier-bloc" data-block="${b.id}" style="font-size:11.5px;">Modifier</button>
            · <button class="link" data-action="dupliquer-bloc" data-block="${b.id}" style="font-size:11.5px;">Dupliquer</button>
            ${!b.stocke ? `· <button class="link" data-action="trier-fournisseurs" data-block="${b.id}" style="font-size:11.5px;" title="Trier les fournisseurs comparés par PA croissant">Trier par prix</button>` : ''}
            ${clients.length > 1 ? `· <button class="link" data-action="dupliquer-vers" data-block="${b.id}" style="font-size:11.5px;">Dupliquer vers...</button>` : ''}
            · <button class="link" data-action="enregistrer-modele" data-block="${b.id}" style="font-size:11.5px;">Enregistrer comme modèle</button>
            ${b.nouveaute ? `· <button class="link" data-action="basculer-catalogue" data-block="${b.id}" style="font-size:11.5px;color:var(--good);font-weight:600;">→ Basculer vers le catalogue actif</button>` : ''}
            ${!b.archived

          </div>
        </div>
        ${!isExpanded ? '' : `
        <div class="block-body">
          ${buildSupplierMatrixHTML(b)}
          <div class="add-offer-row">
            ${!b.stocke ? `<button class="link" data-action="ajouter-fournisseur" data-block="${b.id}">+ Ajouter un fournisseur à comparer</button>` : ''}
            ${pendingDelete && pendingDelete.type==='bloc' && pendingDelete.blockId===b.id
              ? `<span class="inline-confirm" style="margin-left:auto;"><span>Supprimer ce produit ?</span>
                   <button class="ghost" data-action="suppr-bloc-confirmer" data-block="${b.id}" style="color:var(--bad);border-color:var(--bad);">Confirmer</button>
                   <button class="ghost" data-action="suppr-bloc-annuler" data-block="${b.id}">Annuler</button></span>`
              : `<button class="link" style="margin-left:auto;color:var(--bad);" data-action="suppr-bloc" data-block="${b.id}">Supprimer ce produit</button>`
            }
          </div>
          <p class="form-section-label" style="border-top:none;padding-top:0;margin-top:14px;">Détail par quantité</p>
          <table class="synth" style="margin-bottom:4px;">
            <thead>
              <tr>
                <th>Quantité</th>
                <th>Fournisseur retenu</th>
                <th>PA retenu</th>
                <th>Frais port ${b.categorie === 'Print' ? '(au lot)' : '(par unité)'}</th>
                ${b.categorie === 'Textile' ? '<th>Frais technique (par unité)</th>' : ''}
                <th>Coût unitaire total</th>
                <th>Coeff. marge</th>
                <th>Marge unitaire</th>
                <th>Taux de marge</th>
                <th>Marge totale</th>
                <th>Évolution PA vs catalogue</th>
              </tr>
            </thead>
            <tbody>
              ${allQuantitesDuBloc(b).map(q=>{
                const cq = computeBlock(b, q);
                const tauxQ = cq.pv ? (cq.marge / cq.pv) * 100 : null;
                const seuilQ = seuils[b.categorie] || 0;
                const belowSeuilQ = seuilQ > 0 && tauxQ !== null && tauxQ < seuilQ;
                return `
                <tr>
                  <td class="num" style="font-weight:700;">${q}</td>
                  <td>${escapeHtml(cq.fournRetenu)}</td>
                  <td class="num">${fmtE(cq.paRetenu)}</td>
                  <td class="num">${fmtE(cq.fraisParUnite)}</td>
                  ${b.categorie === 'Textile' ? `<td class="num">${fmtE(cq.fraisTechParUnite)}</td>` : ''}
                  <td class="num">${fmtE(cq.coutTotal)}</td>
                  <td class="num">${cq.coeff.toFixed(2)}x</td>
                  <td class="num">${fmtE(cq.marge)}</td>
                  <td class="num" style="${belowSeuilQ?'color:var(--bad);font-weight:700;':''}">${tauxQ===null?'—':(Math.round(tauxQ*10)/10).toLocaleString('fr-FR')+' %'}</td>
                  <td class="num" style="font-weight:700;">${fmtE(cq.margeTotale)}</td>
                  <td class="num" style="${cq.ecart>0?'color:var(--bad);':cq.ecart<0?'color:var(--good);':''}">${cq.ecart===0?'—':fmtPct(cq.evolPct)}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
          <div class="tags-row">
            <span style="font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--ink-soft);">Étiquettes :</span>
            ${tags.map(t=>`<span class="tag-chip">${escapeHtml(t)}<button data-action="suppr-tag" data-block="${b.id}" data-tag="${escapeHtml(t)}">×</button></span>`).join('')}
            <input type="text" class="tag-input" placeholder="+ étiquette" data-newtag="${b.id}">
            <button class="link" data-action="ajouter-tag" data-block="${b.id}">Ajouter</button>
          </div>
          ${(b.catalogue.historique && b.catalogue.historique.length) ? `
          <details class="history-details">
            <summary>Historique des prix catalogue (${b.catalogue.historique.length})</summary>
            <table class="synth" style="margin-top:8px;">
              <thead><tr><th>Date</th><th>Fournisseur</th><th>PA</th><th>PV</th></tr></thead>
              <tbody>
                ${b.catalogue.historique.slice().reverse().map(h=>`
                  <tr><td class="num">${fmtDate(h.date)}</td><td>${escapeHtml(h.fournisseur||'')}</td><td class="num">${fmtE(h.pa)}</td><td class="num">${fmtE(h.pv)}</td></tr>
                `).join('')}
              </tbody>
            </table>
          </details>` : ''}
        </div>
        `}
      `;
      holder.appendChild(div);
    });
    
    if(blocks.length > visibleCount){
      const more = document.createElement('button');
      more.className = 'ghost';
      more.style.cssText = 'width:100%;margin-top:4px;';
      more.textContent = `Afficher plus (${blocks.length - visibleCount} restant(s))`;
      more.onclick = ()=>{ visibleCount += PAGE_SIZE; renderBlocks(); };
      holder.appendChild(more);
    }

    holder.querySelectorAll('[data-bulkselect]').forEach(cb=>{
      cb.onchange = ()=>{
        const id = cb.getAttribute('data-bulkselect');
        if(cb.checked) selectedBlocks.add(id); else selectedBlocks.delete(id);
        renderBlocks();
      };
    });
  }

  let pendingDelete = null; // {type:'bloc'|'offre', blockId, offerId}
  let formPriceRows = []; // {id, quantite, pa, frais} — lignes du tableau de prix en cours d'édition dans le formulaire produit
  let editingOffer = null; // {blockId, offerId} ou null
  let offerPriceRows = []; // {id, quantite, pa, frais} — lignes de prix de l'offre en cours d'édition
  let offerPriceRowsCategorie = ''; // catégorie du produit en cours (pour savoir si Frais technique s'applique)

  document.addEventListener('click', async (e)=>{
    const t = e.target;
    const action = t.getAttribute && t.getAttribute('data-action');
    if(!action) return;
    const blockId = t.getAttribute('data-block');
    const blocks = data[currentClient];
    const block = blocks.find(b=>b.id===blockId);

    if(action === 'toggle-bloc'){
      if(expandedBlocks.has(blockId)) expandedBlocks.delete(blockId); else expandedBlocks.add(blockId);
      renderBlocks();
      return;
    }
    if(action === 'modifier-bloc'){
      editingBlockId = blockId;
      showForm = true;
      renderAll();
      document.getElementById('formZone').scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }
    if(action === 'dupliquer-bloc'){
      const orig = block;
      const copy = JSON.parse(JSON.stringify(orig));
      copy.id = uid();
      copy.offres = (copy.offres || []).map(o => ({...o, id: uid()}));
      copy.catalogue.date = today();
      const idx = blocks.findIndex(b=>b.id===blockId);
      blocks.splice(idx + 1, 0, copy);
      await saveClient(currentClient);
      expandedBlocks.add(copy.id);
      renderAll();
      showBanner('Produit dupliqué juste en dessous — pensez à ajuster la quantité si besoin.', 'info');
      logActivity(`Produit dupliqué : ${orig.produit} (${currentClient})`);
      return;
    }
    if(action === 'trier-fournisseurs'){
      if(block.offres.length < 2){ showBanner('Il faut au moins 2 fournisseurs comparés pour les trier.', 'info'); return; }
      block.offres.sort((a,b2)=> a.pa - b2.pa);
      await saveClient(currentClient);
      logActivity(`Fournisseurs triés par prix croissant : ${block.produit} (${currentClient})`);
      renderAll();
      return;
    }
    if(action === 'dupliquer-vers'){
      openDuplicateToClientModal(blockId);
      return;
    }
    if(action === 'enregistrer-modele'){
      openSaveAsTemplateModal(blockId);
      return;
    }
    if(action === 'basculer-catalogue'){
      pushUndo(`bascule de « ${block.produit} » vers le catalogue actif`, currentClient);
      block.nouveaute = false;
      addTodoIfNotExists('nouveaute', block, currentClient, 'catalogue');
      await saveTodos();
      await saveClient(currentClient);
      logActivity(`Produit basculé vers le catalogue actif : ${block.produit} (${currentClient})`);
      showBanner(`« ${block.produit} » a rejoint le catalogue actif ✓`, 'info');
      renderAll();
      return;
    }
    if(action === 'archiver-bloc'){
      pushUndo(`retrait du catalogue de « ${block.produit} »`, currentClient);
      block.archived = true;
      addTodoIfNotExists('desactiver', block, currentClient);
      await saveTodos();
      await saveClient(currentClient);
      logActivity(`Produit retiré du catalogue : ${block.produit} (${currentClient})`);
      showBanner(`Produit retiré du catalogue : ${block.produit} · <a href="#" id="undoLink" style="color:inherit;font-weight:700;">Annuler</a>`, 'info');
      renderAll();
      const undoLink = document.getElementById('undoLink');
      if(undoLink) undoLink.onclick = (e)=>{ e.preventDefault(); undoLast(); };
      return;
    }
    if(action === 'restaurer-bloc'){
      pushUndo(`remise au catalogue de « ${block.produit} »`, currentClient);
      block.archived = false;
      removePendingTodo('desactiver', block.id);
      await saveTodos();
      await saveClient(currentClient);
      logActivity(`Produit remis au catalogue : ${block.produit} (${currentClient})`);
      showBanner(`Produit remis au catalogue : ${block.produit}`, 'info');
      renderAll();
      return;
    }
    if(action === 'ajouter-tag'){
      const input = document.querySelector(`[data-newtag="${blockId}"]`);
      const val = input.value.trim();
      if(!val) return;
      if(!block.tags) block.tags = [];
      if(!block.tags.includes(val)) block.tags.push(val);
      await saveClient(currentClient); renderAll();
      return;
    }
    if(action === 'suppr-tag'){
      const tagVal = t.getAttribute('data-tag');
      block.tags = (block.tags || []).filter(x=>x!==tagVal);
      await saveClient(currentClient); renderAll();
      return;
    }
    if(action === 'suppr-bloc'){
      pendingDelete = {type:'bloc', blockId};
      renderBlocks(); return;
    }
    if(action === 'suppr-bloc-annuler'){ pendingDelete = null; renderBlocks(); return; }
    if(action === 'suppr-bloc-confirmer'){
      const removed = blocks.find(b=>b.id===blockId);
      pushUndo(`suppression de « ${removed ? removed.produit : 'produit'} »`, currentClient);
      data[currentClient] = blocks.filter(b=>b.id!==blockId);
      pendingDelete = null;
      await saveClient(currentClient);
      if(removed){
        logActivity(`Produit supprimé : ${removed.produit} (${currentClient})`);
        showBanner(`Produit supprimé : ${removed.produit} · <a href="#" id="undoLink" style="color:inherit;font-weight:700;">Annuler</a>`, 'info');
      }
      renderAll();
      const undoLink = document.getElementById('undoLink');
      if(undoLink) undoLink.onclick = (e)=>{ e.preventDefault(); undoLast(); };
      return;
    }
    if(action === 'suppr-fournisseur'){
      const offerId = t.getAttribute('data-offer');
      const offer = block.offres.find(o=>o.id===offerId);
      pushUndo(`retrait du fournisseur « ${offer ? offer.fournisseur : ''} » sur « ${block.produit} »`, currentClient);
      block.offres = block.offres.filter(o=>o.id!==offerId);
      await saveClient(currentClient); renderAll(); return;
    }
    if(action === 'modifier-fournisseur'){
      openOfferModal(blockId, t.getAttribute('data-offer'));
      return;
    }
    if(action === 'ajouter-fournisseur'){
      openOfferModal(blockId, null);
      return;
    }
    if(action === 'ajouter-quantite'){
      const input = document.getElementById(`newQtyInput-${blockId}`);
      const qty = parseNum(input ? input.value : '');
      if(!qty || qty <= 0){ showBanner('Merci de saisir une quantité valide (> 0).'); return; }
      const already = (block.catalogue.prix||[]).some(p=>p.quantite===qty);
      if(already){ showBanner('Cette quantité existe déjà dans le comparatif.'); return; }
      pushUndo(`ajout de la quantité ${qty} au comparatif de « ${block.produit} »`, currentClient);
      if(!block.catalogue.prix) block.catalogue.prix = [];
      const pvDepart = block.catalogue.prix.length ? block.catalogue.prix[0].pv : block.catalogue.pv;
      block.catalogue.prix.push({id: uid(), quantite: qty, pa: block.catalogue.pa, frais: block.catalogue.frais||0, pv: pvDepart, historique: []});
      await saveClient(currentClient);
      logActivity(`Quantité ${qty} ajoutée au comparatif de ${block.produit} (${currentClient})`);
      renderAll();
      return;
    }
    if(action === 'suppr-quantite'){
      const qty = parseNum(t.getAttribute('data-qty'));
      pushUndo(`retrait de la quantité ${qty} du comparatif de « ${block.produit} »`, currentClient);
      block.catalogue.prix = (block.catalogue.prix||[]).filter(p=>p.quantite!==qty);
      block.offres.forEach(o=>{ o.prix = (o.prix||[]).filter(p=>p.quantite!==qty); });
      await saveClient(currentClient);
      renderAll();
      return;
    }
  });
  document.addEventListener('click', (e)=>{
    if(openFilterColumn && !e.target.closest('.colfilter-wrap')){
      openFilterColumn = null;
      updateFournDetail();
    }
  });
  document.addEventListener('input', (e)=>{
    const t = e.target;
    if(t.matches && (t.matches('.pa-input') || t.matches('table.offers input.edit-input.pa') || t.matches('[data-seuil]'))){
      const invalid = t.value.trim() !== '' && isNaN(parseNum(t.value));
      t.classList.toggle('field-invalid', invalid);
    }
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && e.target.matches && e.target.matches('.tag-input')){
      const blockId = e.target.getAttribute('data-newtag');
      const btn = document.querySelector(`[data-action="ajouter-tag"][data-block="${blockId}"]`);
      if(btn) btn.click();
      return;
    }
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;

    if(e.key === 'Escape'){
      const modal = document.getElementById('exportModal');
      if(modal && modal.innerHTML.trim() !== ''){ modal.innerHTML = ''; return; }
      if(showForm){ showForm = false; editingBlockId = null; renderAll(); return; }
      if(showAddClient){ showAddClient = false; renderAll(); return; }
      if(renamingClient){ renamingClient = null; renderSidebarClients(); return; }
      if(editingOffer){ editingOffer = null; renderBlocks(); return; }
      return;
    }
    if(e.key === '/' && !typing){
      e.preventDefault();
      const input = document.getElementById('searchInput') || document.getElementById('globalSearchInput') || document.getElementById('fournSearchInput');
      if(input) input.focus();
      return;
    }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing){
      e.preventDefault();
      undoLast();
      return;
    }
  });
  document.addEventListener('change', async (e)=>{
    const t = e.target;
    if(t.getAttribute && (t.getAttribute('data-action')==='retenir' || t.getAttribute('data-action')==='retenir-matrix')){
      const blockId = t.getAttribute('data-block');
      const offerId = t.getAttribute('data-offer');
      const block = data[currentClient].find(b=>b.id===blockId);
      const previousKey = (block.offres.find(o=>o.retenu) || {id:'__catalogue__'}).id;
      const previousFourn = (block.offres.find(o=>o.retenu) || block.catalogue).fournisseur;
      // avant de changer, on capture le prix retenu actuel à chaque quantité, pour le conserver dans l'historique
      const qtysAvant = allQuantitesDuBloc(block).map(q => ({ q, snapshot: computeBlock(block, q) }));
      block.offres.forEach(o=> o.retenu = (o.id===offerId && offerId !== ''));
      const newKey = (block.offres.find(o=>o.retenu) || {id:'__catalogue__'}).id;
      const newFourn = (block.offres.find(o=>o.retenu) || block.catalogue).fournisseur;
      if(newKey !== previousKey){
        if(!block.retenuHistorique) block.retenuHistorique = [];
        block.retenuHistorique.push({date: today(), fournisseur: newFourn});
        logActivity(`Fournisseur retenu changé pour ${previousFourn} → ${newFourn} sur ${block.produit} (${currentClient})`);
        addTodoIfNotExists('nouveaute', block, currentClient, 'fournisseur');
        await saveTodos();
        // on ajoute l'ancien prix retenu (celui d'avant ce changement) à l'historique de prix de chaque quantité,
        // pour qu'il reste visible en plus du nouveau prix désormais retenu
        if(!block.catalogue.prix) block.catalogue.prix = [];
        qtysAvant.forEach(({q, snapshot})=>{
          let row = block.catalogue.prix.find(p=>p.quantite===q);
          if(!row){ row = {id: uid(), quantite: q, pa: snapshot.paRetenu, frais: 0, historique: []}; block.catalogue.prix.push(row); }
          if(!row.historique) row.historique = [];
          row.historique.push({date: today(), pa: snapshot.paRetenu, fournisseur: snapshot.fournRetenu});
        });
      }
      await saveClient(currentClient); renderAll();
    }
    if(t.getAttribute && t.getAttribute('data-action')==='toggle-designer'){
      const blockId = t.getAttribute('data-block');
      const block = data[currentClient].find(b=>b.id===blockId);
      block.designerARefaire = t.checked;
      if(t.checked){
        addTodoIfNotExists('designer', block, currentClient);
      } else {
        removePendingTodo('designer', blockId);
      }
      await saveTodos();
      await saveClient(currentClient); renderAll();
    }
    if(t.classList && t.classList.contains('matrix-input')){
      const field = t.getAttribute('data-mfield');
      const blockId = t.getAttribute('data-block');
      const block = data[currentClient].find(b=>b.id===blockId);
      if(!block) return;
      const val = parseNum(t.value);
      if(isNaN(val)){ showBanner('Merci de saisir un nombre valide.'); renderBlocks(); return; }

      if(field === 'pv'){
        const qtyPv = parseNum(t.getAttribute('data-qty'));
        if(!block.catalogue.prix) block.catalogue.prix = [];
        let row = block.catalogue.prix.find(p=>p.quantite===qtyPv);
        if(!row){ row = {id: uid(), quantite: qtyPv, pa: 0, frais: 0, pv: val, historique: []}; block.catalogue.prix.push(row); }
        else row.pv = val;
        if(qtyPv === block.quantite) block.catalogue.pv = val;
        await saveClient(currentClient);
        logActivity(`PV modifié pour la quantité ${qtyPv} : ${block.produit} (${currentClient})`);
        renderBlocks();
        return;
      }

      if(field === 'qty'){
        const oldQty = parseNum(t.getAttribute('data-oldqty'));
        const newQty = val;
        if(!newQty || newQty <= 0){ showBanner('La quantité doit être un nombre supérieur à 0.'); renderBlocks(); return; }
        if(newQty === oldQty){ return; }
        const allSources = [block.catalogue, ...block.offres];
        const usedElsewhere = allSources.some(s=>(s.prix||[]).some(p=>p.quantite===newQty));
        if(usedElsewhere){ showBanner(`La quantité ${newQty} existe déjà dans ce comparatif — choisissez une autre valeur.`); renderBlocks(); return; }
        allSources.forEach(s=>{
          const row = (s.prix||[]).find(p=>p.quantite===oldQty);
          if(row) row.quantite = newQty;
        });
        if(block.quantite === oldQty) block.quantite = newQty;
        await saveClient(currentClient);
        logActivity(`Quantité ${oldQty} renommée en ${newQty} sur ${block.produit} (${currentClient})`);
        renderBlocks();
        return;
      }

      const offerId = t.getAttribute('data-offer');
      const qty = parseNum(t.getAttribute('data-qty'));
      const source = offerId ? block.offres.find(o=>o.id===offerId) : block.catalogue;
      if(!source) return;
      if(!source.prix) source.prix = [];
      let row = source.prix.find(p=>p.quantite===qty);
      if(!row){ row = {id: uid(), quantite: qty, pa: 0, frais: 0, historique: []}; source.prix.push(row); }
      if(!row.historique) row.historique = [];
      if(field === 'pa' && val !== row.pa){
        row.historique.push({date: row.dateMaj || today(), pa: row.pa});
        row.dateMaj = today();
        if(!offerId) block.catalogue.date = today();
      }
      row[field] = val;
      // si cette ligne correspond à la quantité de référence, on met à jour les champs miroir pa/frais
      if(qty === block.quantite){
        source.pa = row.pa;
        source.frais = row.frais || 0;
      }
      await saveClient(currentClient);
      renderBlocks();
    }
  });

  document.getElementById('btnAddProduct').onclick = ()=>{ editingBlockId = null; showForm = true; editingOffer=null; renderAll(); };
  document.getElementById('btnFromTemplate').onclick = openUseTemplateModal;
  document.getElementById('btnImportCSV').onclick = openImportCSVModal;
  document.getElementById('btnPrint').onclick = ()=>{
    (data[currentClient] || []).forEach(b=>expandedBlocks.add(b.id));
    renderBlocks();
    setTimeout(()=>window.print(), 60);
  };
  document.getElementById('btnExportPDF').onclick = exportClientPDF;

  function renderUserInfo(){
    const el = document.getElementById('userInfo');
    if(!el || !currentUserEmail) return;
    el.innerHTML = `
      <span class="user-email" title="${escapeHtml(currentUserEmail)}">${escapeHtml(currentUserEmail)}</span>
      <div class="user-info-row">
        <span class="role-badge ${currentUserRole}">${currentUserRole==='editor'?'Modifier':'Consulter'}</span>
        <button id="signOutBtn">Déconnexion</button>
      </div>
    `;
    document.getElementById('signOutBtn').onclick = ()=> fbAuth.signOut();
  }

  function renderAll(){
    renderTabs();
    renderUserInfo();
    updateSyncIndicator();
    updateSupplierDatalist();
    document.getElementById('clientView').style.display = currentView==='client' ? '' : 'none';
    if(currentView === 'client'){
      renderStats();
      renderFilters();
      renderForm();
      renderBlocks();
    }
    renderSynthese();
    renderGamme();
    renderAlertes();
    renderComparateur();
    renderFournisseurs();
    renderHistorique();
    renderTodoView();
    renderRecherche();
  }

  (function initTheme(){
    try{
      if(localStorage.getItem('smartshop_theme') === 'dark'){
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    }catch(e){}
  })();

  (function initSidebarCollapse(){
    const sidebar = document.getElementById('sidebar');
    const btn = document.getElementById('sidebarCollapseBtn');
    let collapsed = false;
    try{ collapsed = localStorage.getItem('smartshop_sidebar_collapsed') === '1'; }catch(e){}
    if(collapsed) sidebar.classList.add('collapsed');
    btn.onclick = ()=>{
      collapsed = !collapsed;
      sidebar.classList.toggle('collapsed', collapsed);
      try{ localStorage.setItem('smartshop_sidebar_collapsed', collapsed ? '1' : '0'); }catch(e){}
    };
  })();

  // Le chargement des données et le premier rendu sont désormais déclenchés par
  // fbAuth.onAuthStateChanged (voir plus haut), une fois la connexion Google confirmée
  // et le rôle de la personne vérifié dans Firestore.
})();
</script>

</body>
</html>
